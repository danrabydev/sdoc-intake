openapi: 3.1.0
info:
  title: ReqALM API
  version: 0.1.0
  description: Schema-first HTTP surface for ReqALM (foundation slice).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe (M04) — process only; no Postgres/OpenBao calls
      description: |
        Orchestrator **liveness**: returns 200 while the Node process serves HTTP.
        Peripheral outages must not fail liveness (ARCH-DEVENV-HEALTH).
      tags: [ops]
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe (M04, ARCH-DEVENV-HEALTH, ARCH-KEY-FAILCLOSED)
      description: |
        **Readiness** re-probes Postgres, pending migrations, OpenBao (unsealed + Transit KEK round-trip),
        and cheap checks for each enabled role. Results are cached briefly to avoid flooding OpenBao.
        Returns 503 when not ready; check `checks` for per-dependency detail (no secrets).
      tags: [ops]
      responses:
        "200":
          description: Enabled roles and dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/seed/summary:
    get:
      operationId: getSeedSummary
      summary: Dogfood seed counts (dev smoke; no client data in health)
      tags: [ops]
      responses:
        "200":
          description: Aggregate fixture counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedSummary"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Current principal, grants, and effective roles
      tags: [identity]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enveloped profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      summary: Read a project (scoped to caller grants)
      tags: [projects]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/requirements/tree:
    get:
      operationId: listRequirementTree
      summary: List direct children in the requirement tree (lazy, paged)
      tags: [requirements]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: parent
          in: query
          required: false
          description: Parent line base_uid; omit for project roots
          schema:
            type: string
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Paged tree nodes (current version summary + child_count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/requirements/{requirementId}:
    get:
      operationId: getRequirement
      summary: Read a requirement (current version + hierarchy context)
      tags: [requirements]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      responses:
        "200":
          description: Requirement detail (summary fields plus statement, attributes, hierarchy)
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/RequirementDetail"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/grants:
    post:
      operationId: postProjectGrants
      summary: Manage project grants (stub — authorize only)
      tags: [grants]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized stub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ProblemBadRequest:
      description: Invalid request input (validation, malformed body, unsupported media type); only after authentication, project scope and permission pass
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemUnauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemForbidden:
      description: Insufficient permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemNotFound:
      description: Not found (a missing project, a project without a grant, and an unparsable project id are identical)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    DataEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id:
          type: string
    RequirementAncestor:
      type: object
      required: [uid, title, kind]
      properties:
        uid:
          type: string
          description: Ancestor line base_uid
        title:
          type: string
          description: Line title (current version title when available)
        kind:
          type: string
          description: Line kind (e.g. section, requirement, capability)
    RequirementDetail:
      type: object
      description: Current-version requirement read model
      properties:
        parent_uid:
          type: [string, "null"]
          description: Direct parent line base_uid, or null when the line is a project root
        ancestors:
          type: array
          description: Root-first chain of ancestor lines (excludes the requirement itself)
          items:
            $ref: "#/components/schemas/RequirementAncestor"
    ProblemDetails:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum: [not_found, forbidden, unauthenticated, validation, conflict, internal]
        detail:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    HealthResponse:
      type: object
      required: [status, version, mode]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        mode:
          type: string
          enum: [development, production]
    ReadinessResponse:
      type: object
      required: [ready, roles, checks]
      properties:
        ready:
          type: boolean
        roles:
          type: array
          items:
            type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok:
                type: boolean
              detail:
                type: string
    SeedSummary:
      type: object
      required: [identities, project_grants, requirement_lines, requirement_versions]
      properties:
        identities:
          type: integer
        project_grants:
          type: integer
        requirement_lines:
          type: integer
        requirement_versions:
          type: integer
        capabilities:
          type: integer
          description: requirement lines of kind capability
        release_count:
          type: integer
        release_delivers:
          type: integer
          description: rows in the release → version delivers junction
        releases:
          type: array
          items:
            type: object
            required: [id, name, status, delivers, capabilities]
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
                enum: [planned, shipped]
              planned_on:
                type: [string, "null"]
              shipped_on:
                type: [string, "null"]
              delivers:
                type: integer
              capabilities:
                type: integer
        sample_identity_id:
          type: string
          description: e.g. taylor-tester for smoke queries
