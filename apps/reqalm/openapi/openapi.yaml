openapi: 3.1.0
info:
  title: ReqALM API
  version: 0.1.0
  description: Schema-first HTTP surface for ReqALM (foundation slice).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe (M04) — process only; no Postgres/OpenBao calls
      description: |
        Orchestrator **liveness**: returns 200 while the Node process serves HTTP.
        Peripheral outages must not fail liveness (ARCH-DEVENV-HEALTH).
      tags: [ops]
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe (M04, ARCH-DEVENV-HEALTH, ARCH-KEY-FAILCLOSED)
      description: |
        **Readiness** re-probes Postgres, pending migrations, OpenBao (unsealed + Transit KEK round-trip),
        and cheap checks for each enabled role. Results are cached briefly to avoid flooding OpenBao.
        Returns 503 when not ready; check `checks` for per-dependency detail (no secrets).
      tags: [ops]
      responses:
        "200":
          description: Enabled roles and dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/seed/summary:
    get:
      operationId: getSeedSummary
      summary: Dogfood seed counts (dev smoke; no client data in health)
      tags: [ops]
      responses:
        "200":
          description: Aggregate fixture counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedSummary"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Current principal, grants, and effective roles
      tags: [identity]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enveloped profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      summary: Read a project (scoped to caller grants)
      tags: [projects]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/requirements/tree:
    get:
      operationId: listRequirementTree
      summary: List direct children in the requirement tree (lazy, paged)
      tags: [requirements]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: parent
          in: query
          required: false
          description: Parent line base_uid; omit for project roots
          schema:
            type: string
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Paged tree nodes (current version summary + child_count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/requirements/{requirementId}/relations:
    get:
      operationId: getRequirementRelations
      summary: Read trace relations for a requirement line (grouped by kind)
      tags: [requirements]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      responses:
        "200":
          description: Incoming and outgoing trace links grouped by relation kind
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/RequirementRelations"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/contracts:
    get:
      operationId: listProjectContracts
      summary: List contracts with scope and release counts
      tags: [contracts]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Paged contract summaries
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/ContractSummaryPage"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/contracts/{contractId}:
    get:
      operationId: getProjectContract
      summary: Read a contract
      tags: [contracts]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      responses:
        "200":
          description: Contract detail
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/ContractDetail"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/contracts/{contractId}/scope:
    get:
      operationId: listContractScope
      summary: Paged in_scope_of lines for a contract
      tags: [contracts]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Paged scoped requirement/capability versions
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/ContractScopePage"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/contracts/{contractId}/releases:
    get:
      operationId: listContractReleases
      summary: Releases covered by a contract
      tags: [contracts]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      responses:
        "200":
          description: Release summaries for covers_releases
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/ContractReleases"
                  request_id:
                    type: string
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/iterations:
    get:
      operationId: listProjectIterations
      summary: List iterations
      tags: [planning]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200": { description: Paged iterations }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
  /api/v1/projects/{projectId}/iterations/{iterationId}:
    get:
      operationId: getProjectIteration
      summary: Read an iteration
      tags: [planning]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: iterationId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" } }
      responses:
        "200": { description: Iteration detail }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
  /api/v1/projects/{projectId}/change-sets:
    get:
      operationId: listProjectChangeSets
      summary: List change sets
      tags: [planning]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200": { description: Paged change sets }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
  /api/v1/projects/{projectId}/change-sets/{changeSetId}:
    get:
      operationId: getProjectChangeSet
      summary: Read a change set
      tags: [planning]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: changeSetId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" } }
      responses:
        "200": { description: Change set detail }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
  /api/v1/projects/{projectId}/work-item-links:
    get:
      operationId: listProjectWorkItemLinks
      summary: List work item links
      tags: [planning]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200": { description: Paged work item links }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
  /api/v1/projects/{projectId}/work-item-links/{linkId}:
    get:
      operationId: getProjectWorkItemLink
      summary: Read a work item link
      tags: [planning]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: linkId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" } }
      responses:
        "200": { description: Work item link detail }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "404": { $ref: "#/components/responses/ProblemNotFound" }
  /api/v1/projects/{projectId}/catalogs:
    get:
      operationId: listProjectCatalogs
      summary: List catalogs visible at project scope (with imprints)
      tags: [catalogs]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catalogs available to the scoped project (standards + owned project catalogs)
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/ProjectCatalogs"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/catalogs/{catalogId}/imprints/{imprintId}/controls:
    get:
      operationId: listImprintControls
      summary: Paged catalog controls with project-scoped conforming counts
      tags: [catalogs]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: catalogId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        - name: imprintId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9.@_-]{0,159}$"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Paged control summaries
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/CatalogControlPage"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/catalogs/{catalogId}/imprints/{imprintId}/controls/{controlId}:
    get:
      operationId: getImprintControl
      summary: Catalog control detail with conforming project lines
      tags: [catalogs]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: catalogId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
        - name: imprintId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9.@_-]{0,159}$"
        - name: controlId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      responses:
        "200":
          description: Control text and conforming lines in this project
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/CatalogControlDetail"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/requirements/{requirementId}:
    get:
      operationId: getRequirement
      summary: Read a requirement (current version + hierarchy context)
      tags: [requirements]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
      responses:
        "200":
          description: Requirement detail (summary fields plus statement, attributes, hierarchy)
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    $ref: "#/components/schemas/RequirementDetail"
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
  /api/v1/projects/{projectId}/grants:
    post:
      operationId: postProjectGrants
      summary: Manage project grants (stub — authorize only)
      tags: [grants]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized stub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelope"
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ProblemBadRequest:
      description: Invalid request input (validation, malformed body, unsupported media type); only after authentication, project scope and permission pass
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemUnauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemForbidden:
      description: Insufficient permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProblemNotFound:
      description: Not found (a missing project, a project without a grant, and an unparsable project id are identical)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    DataEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id:
          type: string
    RequirementAncestor:
      type: object
      required: [uid, title, kind]
      properties:
        uid:
          type: string
          description: Ancestor line base_uid
        title:
          type: string
          description: Line title (current version title when available)
        kind:
          type: string
          description: Line kind (e.g. section, requirement, capability)
    RelationPeer:
      type: object
      required: [id, title, kind, type, project_id]
      properties:
        id:
          type: string
          description: Line base_uid or catalog item uid
        title:
          type: string
        kind:
          type: string
        type:
          type: string
          description: mint_kind or catalog_control
        project_id:
          type: string
          description: Project that owns the peer line (anchor project for standard-catalog controls)
    RelationLink:
      oneOf:
        - type: object
          additionalProperties: false
          required: [restricted, relation_kind, direction]
          properties:
            restricted:
              type: boolean
              const: true
            relation_kind:
              type: string
              enum: [conforms_to, uses, satisfies, refines]
            direction:
              type: string
              enum: [incoming, outgoing]
        - type: object
          required: [relation_kind, direction, self_version_id, peer_version_id, peer, trace_suspect]
          properties:
            relation_kind:
              type: string
              enum: [conforms_to, uses, satisfies, refines]
            direction:
              type: string
              enum: [incoming, outgoing]
            self_version_id:
              type: string
              description: This line's endpoint uid on the edge (base or pinned version)
            peer_version_id:
              type: string
              description: Peer endpoint uid on the edge
            peer:
              $ref: "#/components/schemas/RelationPeer"
            catalog_imprint_id:
              type: [string, "null"]
              description: Set only on visible conforms_to links to a catalog item
            trace_suspect:
              type: boolean
    CatalogImprintSummary:
      type: object
      required: [id, version_label, status]
      properties:
        id:
          type: string
        version_label:
          type: string
        status:
          type: string
    CatalogSummary:
      type: object
      required: [id, title, is_standard, imprints]
      properties:
        id:
          type: string
        title:
          type: string
        is_standard:
          type: boolean
        imprints:
          type: array
          items:
            $ref: "#/components/schemas/CatalogImprintSummary"
    ProjectCatalogs:
      type: object
      required: [project_id, catalogs]
      properties:
        project_id:
          type: string
        catalogs:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSummary"
    CatalogControlSummary:
      type: object
      required: [id, title, family, conforming_count]
      properties:
        id:
          type: string
        title:
          type: string
        family:
          type: string
        conforming_count:
          type: integer
          minimum: 0
    CatalogControlPage:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogControlSummary"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    ConformingPin:
      type: object
      required: [edge_uid, trace_suspect]
      properties:
        edge_uid:
          type: string
          description: from_uid on the conforms_to trace edge (pinned requirement version uid)
        trace_suspect:
          type: boolean
    ConformingProjectLine:
      type: object
      required: [id, title, status, pins]
      properties:
        id:
          type: string
          description: Requirement line base_uid
        title:
          type: [string, "null"]
        status:
          type: string
        pins:
          type: array
          items:
            $ref: "#/components/schemas/ConformingPin"
    CatalogControlDetail:
      type: object
      required: [id, title, family, text, conforming_lines]
      properties:
        id:
          type: string
        title:
          type: string
        family:
          type: string
        text:
          type: [string, "null"]
        conforming_lines:
          type: array
          items:
            $ref: "#/components/schemas/ConformingProjectLine"
    ContractSummary:
      type: object
      additionalProperties: false
      required: [id, title, kind, description, scope_count, release_count]
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          type: string
        description:
          type: [string, "null"]
        scope_count:
          type: integer
          minimum: 0
        release_count:
          type: integer
          minimum: 0
    ContractSummaryPage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContractSummary"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    ContractDetail:
      allOf:
        - $ref: "#/components/schemas/ContractSummary"
        - type: object
          additionalProperties: false
          required: [project_id, client_id, status, starts_on, ends_on, notes]
          properties:
            project_id:
              type: string
            client_id:
              type: string
            status:
              type: string
            starts_on:
              type: [string, "null"]
            ends_on:
              type: [string, "null"]
            notes:
              type: [string, "null"]
    ContractScopeLine:
      type: object
      additionalProperties: false
      required: [uid, base, kind, status, version]
      properties:
        uid:
          type: string
        base:
          type: string
        kind:
          type: string
        status:
          type: string
        version:
          type: integer
    ContractScopePage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContractScopeLine"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    ContractReleaseSummary:
      type: object
      additionalProperties: false
      required: [id, name, status, planned_on, shipped_on]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        planned_on:
          type: [string, "null"]
        shipped_on:
          type: [string, "null"]
    ContractReleases:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContractReleaseSummary"
    RequirementRelations:
      type: object
      required: [id, project_id, outgoing, incoming]
      properties:
        id:
          type: string
          description: Requirement line base_uid
        project_id:
          type: string
        outgoing:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/RelationLink"
          description: Links where this line/version is the source, grouped by relation_kind
        incoming:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/RelationLink"
          description: Links where this line/version is the target, grouped by relation_kind
    RequirementDetail:
      type: object
      description: Current-version requirement read model
      properties:
        parent_uid:
          type: [string, "null"]
          description: Direct parent line base_uid, or null when the line is a project root
        ancestors:
          type: array
          description: Root-first chain of ancestor lines (excludes the requirement itself)
          items:
            $ref: "#/components/schemas/RequirementAncestor"
    ProblemDetails:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum: [not_found, forbidden, unauthenticated, validation, conflict, internal]
        detail:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    HealthResponse:
      type: object
      required: [status, version, mode]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        mode:
          type: string
          enum: [development, production]
    ReadinessResponse:
      type: object
      required: [ready, roles, checks]
      properties:
        ready:
          type: boolean
        roles:
          type: array
          items:
            type: string
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok:
                type: boolean
              detail:
                type: string
    SeedSummary:
      type: object
      required: [identities, project_grants, requirement_lines, requirement_versions]
      properties:
        identities:
          type: integer
        project_grants:
          type: integer
        requirement_lines:
          type: integer
        requirement_versions:
          type: integer
        capabilities:
          type: integer
          description: requirement lines of kind capability
        release_count:
          type: integer
        release_delivers:
          type: integer
          description: rows in the release → version delivers junction
        releases:
          type: array
          items:
            type: object
            required: [id, name, status, delivers, capabilities]
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
                enum: [planned, shipped]
              planned_on:
                type: [string, "null"]
              shipped_on:
                type: [string, "null"]
              delivers:
                type: integer
              capabilities:
                type: integer
        sample_identity_id:
          type: string
          description: e.g. taylor-tester for smoke queries
