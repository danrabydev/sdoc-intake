# ReqALM developer environment (ARCH-DEVENV-COMPOSE.1).
# Default: app + peripherals (2 containers). Hybrid: `docker compose up peripherals -d` then `pnpm dev:reqalm`.

services:
  peripherals:
    build:
      context: .
      dockerfile: Dockerfile
      target: peripherals
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reqalm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm devenv:init — POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-reqalm}
    volumes:
      - reqaml-pg:/var/lib/postgresql/data
      - reqaml-openbao:/var/lib/reqalm/openbao
      - reqaml-secrets:/var/lib/reqalm/secrets
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    depends_on:
      peripherals:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      REQALM_MODE: ${REQALM_MODE:-development}
      REQALM_ROLES: ${REQALM_ROLES:-api,web,mcp,sync}
      REQALM_PORT: ${REQALM_PORT:-3000}
      REQALM_VERSION: ${REQALM_VERSION:-0.1.0-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-reqalm}:${POSTGRES_PASSWORD}@peripherals:5432/${POSTGRES_DB:-reqalm}
      OPENBAO_ADDR: http://peripherals:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      OPENBAO_TOKEN_FILE: /var/lib/reqalm/secrets/openbao-root.token
      REQALM_OPENBAO_DEV_MARKED: ${REQALM_OPENBAO_DEV_MARKED:-true}
      REQALM_SEED_ON_START: ${REQALM_SEED_ON_START:-true}
      REQALM_SEED_PATH: /repo/docs/design/seed/dogfood.yaml
    volumes:
      - reqaml-secrets:/var/lib/reqalm/secrets:ro
    ports:
      - "127.0.0.1:${REQALM_HOST_PORT:-3000}:${REQALM_PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "http://127.0.0.1:${REQALM_PORT:-3000}/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

# Volume names keep the legacy ReqAML spelling on purpose: existing dev stacks keep their Postgres,
# OpenBao and secrets data across the rename (renaming them would silently start from empty volumes).
volumes:
  reqaml-pg:
  reqaml-openbao:
  reqaml-secrets:
