new_requirements:
- base_uid: ARCH-WRITE-DB-RUNTIME-ROLE
  uid: ARCH-WRITE-DB-RUNTIME-ROLE
  version_n: 0
  parent: SEC-API
  kind: requirement
  title: Runtime DB role is least-privilege non-owner
  status: draft
  statement: The running application shall connect to Postgres as a dedicated runtime login role that owns no schema objects and holds only the table privileges the
    application needs (SELECT/INSERT/UPDATE/DELETE per table; INSERT and SELECT only on append-only audit tables). The runtime role shall not execute DDL (CREATE,
    ALTER, DROP), TRUNCATE, or GRANT, and shall be NOSUPERUSER, NOCREATEDB, NOCREATEROLE and NOBYPASSRLS so row-level security on tenant tables cannot be bypassed.
    Schema migrations shall run as a separate owner role whose credentials are not available to the running application process. In production the app shall refuse
    to start if its runtime role owns tables, can bypass RLS, or holds DDL or TRUNCATE privilege.
  security:
    catalog_ref: AC-6
    verification_note: Proposed by Cyber control mapping 2026-10-09; claim of applicability, unverified.
  conforms_to:
  - control: AC-6
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: AC-6 Least Privilege
    rationale: Runtime role limited to required DML; no DDL/TRUNCATE/GRANT; migrations use a separate owner role.
  - control: CM-5.5
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: CM-5(5) Privilege Limitation for Production and Operation
    rationale: Privilege to change the production schema is held only by the migration owner role, not the operational runtime.
  - control: AU-9
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: AU-9 Protection of Audit Information
    rationale: Runtime role has INSERT/SELECT only on append-only audit tables, so a compromised app credential cannot modify or delete audit records.
  - control: V-222430
    catalog_imprint_id: asd-stig@v6r4
    control_title: The application must execute without excessive account permissions.
    rationale: '"The application must execute without excessive account permissions" - direct match for the runtime DB role.'
  trace_edges:
  - from_uid: ARCH-WRITE-DB-RUNTIME-ROLE
    kind: refines
    to: ARCH-CP-SCOPE
    why: RLS non-bypass is the enforcement half of the mandatory client_id/RLS requirement.
  - from_uid: ARCH-WRITE-TRUNCATE-GUARD
    kind: refines
    to: ARCH-WRITE-DB-RUNTIME-ROLE
    why: TRUNCATE guard is defence-in-depth under the runtime-role requirement (retarget its current refines ARCH-CP-SCOPE edge here, or keep both).
  notes: 'TRUNCATE-GUARD (unshipped, unlocked) already says "runtime application DB role shall not be table owner"; that clause now duplicates this requirement. Optional:
    content-mint ARCH-WRITE-TRUNCATE-GUARD.1 limited to the trigger guard, and change its catalog_ref CM-6 -> AC-6. Suggested test bed: FIX-DENY-RUNTIME-ROLE-DDL
    (runtime role: TRUNCATE/ALTER/SET row_security=off all fail; migration role succeeds).'
- base_uid: ARCH-SEC-TLS
  uid: ARCH-SEC-TLS
  version_n: 0
  parent: SEC-SEC
  kind: requirement
  title: TLS for all non-loopback traffic
  status: draft
  statement: Before any non-127.0.0.1 deployment, the Web UI, API, OAuth AS and MCP endpoints shall be reachable only over TLS 1.2 or later (TLS 1.3 preferred); plaintext
    HTTP shall be refused or redirected without serving content, and responses shall send Strict-Transport-Security. In production the app shall refuse to start when
    its issuer or public base URL is not https. Connections from the app to Postgres and OpenBao that leave a single host shall use TLS with server certificate verification.
  security:
    catalog_ref: SC-8
    verification_note: Proposed by Cyber control mapping 2026-10-09; claim of applicability, unverified.
  conforms_to:
  - control: SC-8
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: SC-8 Transmission Confidentiality and Integrity
    rationale: Confidentiality and integrity of all transmitted information for UI, API, AS and MCP.
  - control: SC-8.1
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: SC-8(1) Cryptographic Protection
    rationale: Protection is cryptographic (TLS), including app-to-database and app-to-KeyProvider links off-host.
  - control: V-222596
    catalog_imprint_id: asd-stig@v6r4
    control_title: The application must protect the confidentiality and integrity of transmitted information.
    rationale: '"The application must protect the confidentiality and integrity of transmitted information."'
  trace_edges:
  - from_uid: ARCH-SEC-TLS
    kind: refines
    to: ARCH-SEC-HEADERS
    why: Same "before any non-127.0.0.1 deployment" gate; HSTS sits with the other headers.
  notes: 'Checked first: no ARCH/CAP requirement states TLS for the product as a whole. Only ARCH-CRED-HASH ("passwords travel only over TLS"), SEC-MCP/MC02/CAP-MCP-DESK
    ("mutate via HTTPS") and A01 (SC-8 pin with no TLS text) touch it. ARCH-CRED-SESSION requires Secure cookies, which presumes HTTPS.'
- base_uid: ARCH-SUPPLY-VENDORED
  uid: ARCH-SUPPLY-VENDORED
  version_n: 0
  parent: SEC-BUILD
  kind: requirement
  title: Vendored third-party code is inventoried and hash-pinned
  status: draft
  statement: Third-party code committed to the repository (for example apps/reqalm/src/web/public/vendor/qr-min.js) shall be listed in a vendor manifest with package,
    version, license, source URL, upstream registry integrity and the SHA-256 of the committed bytes. A test in the pnpm test gate shall fail when committed bytes
    differ from the recorded hash. Vendored browser code shall be served same-origin only.
  security:
    catalog_ref: SI-7
    verification_note: Proposed by Cyber control mapping 2026-10-09; claim of applicability, unverified.
  conforms_to:
  - control: SI-7
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: SI-7 Software, Firmware, and Information Integrity
    rationale: Test-enforced SHA-256 pin detects unauthorized changes to vendored code.
  - control: CM-8
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: CM-8 System Component Inventory
    rationale: Vendor manifest is the component inventory for code not tracked by the lockfile.
  - control: SR-4
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: SR-4 Provenance
    rationale: Manifest records origin (source URL, tag, registry integrity) of each vendored component.
  trace_edges:
  - from_uid: CAP-MFA-QR
    kind: satisfies
    to: ARCH-SUPPLY-VENDORED
    why: qr-min is the vendored component; README.md manifest and the sha256 test in mfa-enroll-ui.test.ts already exist on main.
  notes: Practice already exists on main (apps/reqalm/src/web/public/vendor/README.md records npm integrity + SHA-256; mfa-enroll-ui.test.ts asserts the hash), but
    no requirement states it, so SI-7/CM-8 cannot be pinned to a statement today. Do not mark pass on the new requirement until a Tester records it, though evidence
    exists.
- base_uid: ARCH-SUPPLY-DEP-SCAN
  uid: ARCH-SUPPLY-DEP-SCAN
  version_n: 0
  parent: SEC-BUILD
  kind: requirement
  title: Dependency vulnerability scanning gate
  status: draft
  statement: Production dependencies shall be scanned for known vulnerabilities (pnpm audit --prod or equivalent) on every pull request and at least weekly on main.
    High or critical advisories in production dependencies shall block merge unless a time-limited risk acceptance naming the advisory is recorded; scan results shall
    be retained with the build.
  security:
    catalog_ref: RA-5
    verification_note: Proposed by Cyber control mapping 2026-10-09; claim of applicability, unverified.
  conforms_to:
  - control: RA-5
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: RA-5 Vulnerability Monitoring and Scanning
    rationale: Recurring automated vulnerability scanning of components.
  - control: SI-2
    catalog_imprint_id: nist-800-53@rev5-dogfood-20261006
    control_title: SI-2 Flaw Remediation
    rationale: Findings drive flaw remediation with a blocking threshold.
  - control: V-222614
    catalog_imprint_id: asd-stig@v6r4
    control_title: Security-relevant software updates and patches must be kept up to date.
    rationale: '"Security-relevant software updates and patches must be kept up to date."'
  trace_edges:
  - from_uid: CAP-SVC-STATIC-DEP-PATCH
    kind: satisfies
    to: ARCH-SUPPLY-DEP-SCAN
    why: One-off remediation driven by pnpm audit --prod findings.
  notes: CAP-SVC-STATIC-DEP-PATCH is a one-time patch; nothing in the seed requires ongoing scanning. Lower priority than the DB-role and TLS requirements.
