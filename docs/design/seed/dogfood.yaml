  grooming_state: detailed
- uid: ARCH-CRED-MFA
  base_uid: ARCH-CRED-MFA
  version_n: 0
  status: active
  statement: Privileged roles must use multi-factor authentication. Privileged means roles holding admin, approve, apply, sign-off, ship, steward, or key-custodian permissions in the permission tree. For local accounts the AS enforces a second factor, with MFA secrets wrapped by the key store. For federated logins the AS requires upstream MFA evidence (amr/acr). A session without MFA cannot perform privileged operations. MFA for non-privileged users is a policy preset; factor types and the confirmed privileged-role list are open questions.
  priority: 5
  iteration: iter-r1
  rbac_op: auth:mfa:verify
  security:
