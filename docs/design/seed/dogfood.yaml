- uid: ARCH-CRED-LOCKOUT
  base_uid: ARCH-CRED-LOCKOUT
  version_n: 0
  status: active
  statement: The AS throttles authentication per account and per source, and locks a local account after N consecutive failed attempts within a window (configurable; DoD preset 3 in 15 minutes). While locked, even a correct password is refused with the same generic error, and failures never reveal whether an account exists. Unlock happens only through an approved admin process (auth:account:unlock) or the configured timer. Every failure, lockout, and unlock is audited.
  priority: 5
  iteration: iter-r1
  rbac_op: auth:local:signin, auth:account:unlock
