- uid: ARCH-AUTH-PROFILE
  base_uid: ARCH-AUTH-PROFILE
  version_n: 0
  status: active
  statement: 'Each deployment has an auth profile that sets identity_mode (federated, local, or hybrid), local_accounts (disabled, breakglass_only, or enabled; see ARCH-AUTH-LOCAL.1), and the security presets (ARCH-CRED-POLICY / ARCH-CRED-MFA / ARCH-CRED-SESSION / ARCH-KEY-FIPS). Production defaults: identity_mode=federated, local_accounts=disabled. The profile is deployment configuration validated at startup, not a runtime toggle. A production profile that enables local accounts must name the reason and is logged at startup and in the audit trail. A dev profile (dev seed, dev KeyProvider) is refused in production. Whether a client tenant may override the deployment profile is an open question.'
  priority: 10
