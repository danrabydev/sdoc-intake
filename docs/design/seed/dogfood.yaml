  rbac_op: changeset:retain
  security:
    catalog_ref: AU-2
    verification_note: AU-2/3/12 workflow / approval audit.
- uid: ARCH-CHANGESET-CONFLICT
  base_uid: ARCH-CHANGESET-CONFLICT
  version_n: 0
  status: active
  statement: 'LOCKED stack revert policy (Dan 2026-10-07): (1) Only the latest change set on the stack may be reverted (changeset:revert). Non-latest whole-set revert DENIES (gate-revert-latest-only / FIX-DENY-REVERT-NON-LATEST). (2) Never revert an entire older change set unless that set AND everything after it are abandoned (abandon-suffix / unwind from tip). Abandoned sets remain retained forever (ARCH-CHANGESET-RETAIN) with status=abandoned. (3) Later product want: undo individual item fields from history without reverting whole older change sets (WANT-CHANGESET-FIELD-UNDO) — not encoded as current behavior. Tip revert may still surface unmanageable conflicts with external side effects (shipped delivers, closed contracts); those deny with FIX-DENY-* when defined. Do not invent mid-stack whole-set revert.'
  priority: 20
  iteration: iter-r1
  rbac_op: changeset:conflict_engine
  security:
    catalog_ref: AU-2
    verification_note: AU-2/3/12 workflow / approval audit.
