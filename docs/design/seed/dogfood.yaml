subject_kinds:
- id: RequirementLine
  backing: requirement_line
  kind_filter:
  - requirement
  - section
  - control
  notes: Client sys-req tree node; approval grain (ARCH-APPROVAL-LINE).
- id: CapabilityLine
  backing: requirement_line
  kind_filter:
  - capability
  notes: Contractor capability; first-class SubjectKind (ARCH-REQ-VS-CAP).
- id: RequirementVersion
  backing: requirement_version
  notes: Lifecycle (draft|active|superseded|obsolete|withdrawn), statement_hash (body only), mint_kind, grooming, priority, planning_blocked downstream.
- id: EdgeSatisfies
  backing: edge
  kind_filter:
  - satisfies
  notes: Cap→req coverage; created with cap (no orphan caps). Not a separate approve subject by default.
- id: EdgeConformsTo
  backing: edge
  kind_filter:
  - conforms_to
  notes: Imprint pin; Author request / applicator apply (conformance_pin_request).
- id: ChangeSet
  backing: change_set
  notes: open/close/revert hooks; stack latest-only revert (gate-revert-latest-only); abandon suffix for older whole sets; retain forever.
- id: Release
  backing: release
  notes: Ship / gate-cyber-ship / gate-verification-ship.
