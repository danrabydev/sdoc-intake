- uid: ARCH-AUTH-MCP-REQUIRED
  base_uid: ARCH-AUTH-MCP-REQUIRED
  version_n: 0
  status: active
  statement: "OAuth 2.1 through the internal AS (ARCH-AUTH-AS) is mandatory for MCP in every identity mode: federated, local, or hybrid. MCP hosts always authorize at the internal AS (ARCH-AUTH-PKCE / ARCH-AUTH-METADATA), and the MCP server accepts only internal-AS tokens whose audience is the MCP resource (ARCH-AUTH-AUDIENCE). How the user authenticates behind the AS (upstream IdP, or a local account where the profile allows it) never changes the MCP credential. Upstream provider tokens are never accepted by the MCP server and never forwarded by it. If an MCP tool must call an upstream provider's own APIs, the mechanism (token exchange vs stored upstream grants) is an open design choice (docs/design/auth/mcp-upstream-identity.md), but the AS token remains the MCP credential."
  priority: 5
  iteration: iter-r1
  rbac_op: auth:oauth:authorize, mcp:session:create
  security:
    catalog_ref: IA-2
    verification_note: IA-2 / IA-8; SC-23 audience-bound session authenticity; MCP authorization spec (no token passthrough).
  grooming_state: detailed
- uid: ARCH-AUTH-LOCAL-BREAKGLASS
  base_uid: ARCH-AUTH-LOCAL-BREAKGLASS
  version_n: 0
  status: active
  statement: When the auth profile sets local_accounts=breakglass_only or enabled, a deployment may configure break-glass local recovery admin accounts for when the upstream IdP or its connector is unavailable or misconfigured. These accounts are created only from deployment configuration, never through self-service or the dev seed. Their credentials are long random secrets held under split knowledge and dual control, the same custody model as ARCH-KEY-BREAKGLASS. MFA is always required (ARCH-CRED-MFA), and sessions use the admin idle and absolute timeouts (ARCH-CRED-SESSION). Privileges are limited to recovery operations (restore an upstream connector or admin grants), with no requirement-content access. Every use raises an alert, is audited (ARCH-CRED-AUDIT), and is reviewed, and the credential is rotated after use. Break-glass accounts are protected from removal or disabling except by the documented process, and are exercised on a schedule.
  priority: 15
  iteration: iter-r1
  rbac_op: auth:breakglass:signin, auth:connector:configure
  security:
    catalog_ref: AC-2.2
    verification_note: AC-2(2) emergency accounts; IA-2(1) MFA; AU-2; ASD V-222410 / V-222523.
  grooming_state: detailed
- uid: ARCH-AUTH-UPSTREAM-CONNECTOR
  base_uid: ARCH-AUTH-UPSTREAM-CONNECTOR
  version_n: 0
  status: active
  statement: "Upstream identity providers attach through a pluggable connector interface (built in: OIDC RP and SAML 2.0 SP; other protocols through additional connectors). Each connector is registered to exactly one client tenant (client_id). Its client secrets and signing or decryption keys are stored under the key store (ARCH-KEY-SCOPE). A connector's assertions can only establish sessions for identities linked within that tenant (A06): a subject from client A's connector never obtains grants in client B, and cross-tenant access goes through ReqAML grants, not the connector. Connector configuration is managed by Client admin, needs step-up (ARCH-CRED-REAUTH), and is audited. How many connectors a tenant may have, how one is selected (home-realm discovery), and which non-OIDC/SAML protocols are supported are open questions (docs/design/auth/mcp-upstream-identity.md)."
  priority: 10
  iteration: iter-r1
  rbac_op: auth:connector:configure
  security:
    catalog_ref: IA-8
    verification_note: IA-8 non-organizational users / federation; AC-3 tenant isolation; ASD V-222559 / V-222560.
  grooming_state: detailed
- uid: ARCH-AUTH-CLAIM-MAP
  base_uid: ARCH-AUTH-CLAIM-MAP
  version_n: 0
  status: active
  statement: Mapping from upstream claims or attributes (sub/NameID, email, groups, amr/acr) to ReqAML identity, and optionally to grants, is explicit per-connector configuration. It is versioned, step-up gated, and audited, and is never implicit trust in upstream attributes. The identity key is the upstream issuer plus subject, never email alone. A mapping can never grant beyond its connector's tenant and never grants deployment-scoped roles (for example, Key custodian). Whether upstream groups may provision or deprovision ReqAML grants automatically is an open question. Until it is decided, grants come only from ReqAML grant records (A07 / A08), and upstream claims establish identity and MFA evidence only.
  priority: 10
  iteration: iter-r1
  rbac_op: auth:connector:configure
  security:
    catalog_ref: AC-2
    verification_note: AC-2 account management; AC-6 least privilege; AU-2.
  grooming_state: detailed
- uid: ARCH-AUTH-UPSTREAM-REVOKE
  base_uid: ARCH-AUTH-UPSTREAM-REVOKE
  version_n: 0
  status: active
  statement: Upstream session end and revocation are honored. On an upstream back-channel logout (OIDC Back-Channel Logout or SAML SLO) where the connector supports it, the AS ends the linked ReqAML sessions and revokes their token families, including MCP refresh tokens. Each connector sets a maximum upstream authentication age; ReqAML refresh and session lifetimes never extend access past it without upstream re-authentication. An identity disabled or unlinked in ReqAML (A06 / A08) loses all sessions and tokens immediately. Revocation-propagation events are audited. Handling for IdPs without back-channel logout (polling, SCIM deprovisioning) is an open question, bounded meanwhile by the maximum authentication age.
  priority: 10
  iteration: iter-r1
  rbac_op: auth:oauth:revoke
  security:
    catalog_ref: AC-12
    verification_note: AC-12 session termination; AC-2(3); ASD V-222549 / V-222391.
  grooming_state: detailed
- uid: ARCH-AUTH-AGENT-ATTRIBUTION
  base_uid: ARCH-AUTH-AGENT-ATTRIBUTION
  version_n: 0
  status: active
  statement: "Every action taken through MCP is attributed in audit to the human subject who authorized the MCP host (token sub), together with the OAuth client_id of the MCP host, the token id (jti), and source=mcp. There is no shared or elevated agent principal: an agent acts with the delegating user's grants under RBAC (MC01.1 / MC03). Attribution for headless or agent-only clients that act without a delegating human (client credentials, device flow) is an open question. Until it is decided, such clients are not supported."
  priority: 10
  iteration: iter-r1
  rbac_op: audit:write
  security:
    catalog_ref: AU-3
    verification_note: AU-3 content of audit records; AU-10 non-repudiation; ASD V-222438.
  grooming_state: detailed
