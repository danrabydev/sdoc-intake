    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: C06
  base_uid: C06
  version_n: 0
  status: active
  statement: 'A Reader views the requirement tree as outline or mind map for the scoped project. ReqAML returns

