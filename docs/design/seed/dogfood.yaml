  status: active
  statement: An actor matching the WorkflowProfile RoleBinding for the stakeholder (or solution_approver) slot approves a requirement or capability LINE — not a hard-coded Client admin vs AO. Approve (UI-APPROVE-LINE / requirement:line:approve) writes ApprovalRecord(s) for the selected line AND its direct children, pinning approved_version_uid and approved_statement_hash for each. Approval is separate from lifecycle status (draft/active/obsolete). Activate (D04) ≠ approve. Unapproved lines appear in the approval tree (ARCH-APPROVAL-VIEW); approved ones are dimmed/collapsed. Priority and other profile-selected planning actions require line approved (ARCH-PLANNING-GATES). Version.stakeholder_approval is a denormalized mirror during migrate (dual-write); do not treat it as SoT. Re-approve after content .N clears planning_blocked (FIX-PLANNING-BLOCKED-AFTER-CONTENT-N). Approve hooks evaluate gate-approver-slot (FIX-DENY-APPROVE-WITHOUT-SLOT / FIX-ALLOW-APPROVE-LINE).
