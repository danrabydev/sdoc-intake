requirement_versions:
- uid: SEC-IA
  base_uid: SEC-IA
  version_n: 0
  status: active
  statement: Identity and access actions for ReqAML — SSO sign-in/out, client scoped view, profile, project grant administration, and catalog-steward grants.
- uid: SEC-CP
  base_uid: SEC-CP
  version_n: 0
  status: active
  statement: Client owns projects; all project work assumes a Client Scoped View. Client and project CRUD, archive, and permission-filtered listing live here.
- uid: SEC-RL
  base_uid: SEC-RL
  version_n: 0
  status: active
  statement: Requirement lines are stable tree nodes; requirement versions hold statement and status. Tree edit, version succession, and lineage viewing live here.
- uid: SEC-EDGE
  base_uid: SEC-EDGE
  version_n: 0
  status: active
  statement: Traceability edges connect requirement versions (refines, conforms_to, uses, satisfies). Graph/matrix navigation and edge lifecycle live here.
- uid: SEC-CT
  base_uid: SEC-CT
  version_n: 0
  status: active
  statement: Contracts are junction overlays that mark requirement versions in_scope_of a named agreement. Document views filter by contract and optionally walk parent lines.
- uid: SEC-REL
  base_uid: SEC-REL
  version_n: 0
  status: active
  statement: Releases snapshot the requirement versions they deliver; they are not tree parents. Planned backlog, ship freeze, and release diff live here.
- uid: SEC-CAT
  base_uid: SEC-CAT
  version_n: 0
  status: active
  statement: Catalogs provide standard and project templates. Standard catalogs (NIST/STIG) are versioned as imprints; project REQAML-SEC-* entries are steward-mutable until imprint publish. Stewardship, browse, reference, copy, imprint publish, import-diff, drift review, migrate-to-imprint (preview + apply), and pin semantics live here.
- uid: SEC-CAP
  base_uid: SEC-CAP
  version_n: 0
  status: active
  statement: Capability packs and attached design artifacts (sequences, C4, mockups, OpenAPI) group how requirements are satisfied in the product.
- uid: SEC-WI
  base_uid: SEC-WI
  version_n: 0
  status: active
  statement: 'Work-item sync bridges requirement versions to external trackers: create, map, push/pull fields, conflict resolution, and disconnect.'
- uid: SEC-GROOM
  base_uid: SEC-GROOM
  version_n: 0
  status: active
  statement: Grooming flow turns priority leaves into detailed, WI-ready requirements via parent detail-debt walks and iteration assignment.
- uid: SEC-IO
  base_uid: SEC-IO
  version_n: 0
  status: active
  statement: Import/export interchange with StrictDoc and snapshot bills of requirements. PDF/Markdown document export is deferred.
- uid: SEC-AUDIT
  base_uid: SEC-AUDIT
  version_n: 0
  status: active
  statement: Audit log viewing, OTEL sink configuration, and health/version checks for operators and auditors.
- uid: SEC-UI
  base_uid: SEC-UI
  version_n: 0
  status: active
  statement: React UI ownership chain from App providers through routes, layout, pages, and views, plus chrome that does not write domain data.
- uid: SEC-API
  base_uid: SEC-API
  version_n: 0
  status: active
  statement: Node API layers HTTP adapters, RBAC, business services, audit, and schema-first data providers against Postgres.
- uid: SEC-SEC
  base_uid: SEC-SEC
  version_n: 0
  status: active
  statement: Cross-cutting security controls, NIST/STIG alignment notes, and capability packs for access enforcement.
- uid: SEC-MCP
  base_uid: SEC-MCP
  version_n: 0
  status: active
  statement: MCP agents authenticate like UI users, bind to a requirements desk (browser tab routing), mutate via HTTPS API, and receive live desk pushes on a session-sealed WebSocket.
- uid: A01
  base_uid: A01
  version_n: 0
  status: active
  statement: 'A user signs in via enterprise SSO (OIDC or SAML). ReqAML validates the IdP token,

    establishes a least-privilege session, loads project grants, and emits an auditable sign-in event.

    No local password store exists; MFA is enforced at the IdP. Downstream APIs reject callers without a valid session.'
  priority: 10
  iteration: iter-r0
  rbac_op: auth:signin
  security:
    catalog_ref: IA-2
    verification_note: IA-2 / AC-3 / AU-2/3/12. ASD STIG V6R4 V-222536 (password length IdP-delegated); no local passwords; MFA at IdP.
  stakeholder_approval:
    status: approved
    by: pat-client-admin
    at: '2026-10-05T12:00:00-04:00'
    notes: 'MIRROR of ApprovalRecord ar-a01 (line grain SoT). Dual-write; commercial RoleBinding → Client admin.'
  grooming_state: detailed
  verification_outcome: pass
  statement_hash: sha256:a01-v0
- uid: A02
  base_uid: A02
  version_n: 0
  status: active
  statement: 'An authenticated user signs out. ReqAML terminates the server session, clears the client session handle,

    revokes any desk attachments for that session, and records an auditable logout event.

    Subsequent API calls with the old handle receive an unauthorized outcome.'
  priority: 20
  iteration: iter-r0
  rbac_op: auth:signout
  security:
    catalog_ref: AC-12
    verification_note: AC-12 session termination; AU-2/3/12 logout audit. ASD STIG V6R4 V-222578 / V-222391 / V-222550.
- uid: A03
  base_uid: A03
  version_n: 0
  status: active
  statement: 'An authenticated user selects a Client Scoped View. The active clientId is persisted server-side so

    subsequent queries and mutations are bound to that client for least privilege.

    The UI App shell reads the bound clientId from the session; client-side-only scope is not authoritative.'
  priority: 10
  iteration: iter-r0
  rbac_op: client:scope:select
  security:
    catalog_ref: AC-3
    verification_note: AC-3/AC-6 least privilege via server-bound scope. ASD STIG V6R4 V-222429 / V-222550.
- uid: A04
  base_uid: A04
  version_n: 0
  status: active
  statement: 'A user clears or changes Client Scoped View. ReqAML updates or clears the server-side active client binding,

    invalidates client-scoped caches for the prior binding, and audits the scope change.

    Project routes that require a scoped client refuse to proceed until a valid view is selected again.'
  priority: 30
  iteration: iter-r0
  rbac_op: client:scope:clear
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement on scope clear/change. ASD STIG V6R4 V-222578 / V-222389.
- uid: A05
  base_uid: A05
  version_n: 0
  status: active
  statement: 'A user views their own profile and project grants. ReqAML returns only the caller''s identity record and

    grants (no cross-subject disclosure). Grant role names and project ids are included so the UI can render

    authorized navigation without a separate admin call.'
  priority: 40
  iteration: iter-r0
  rbac_op: identity:read_self
  security:
    catalog_ref: AC-3
    verification_note: AC-3 self-read boundary; AU access logging where required. ASD STIG V6R4 V-222430.
- uid: A06
  base_uid: A06
  version_n: 0
  status: active
  statement: 'An admin invites or links an identity to a client or project. ReqAML records the external IdP subject

    binding, creates or updates the identity row, and audits who linked whom.

    Invitation does not by itself grant project roles; grant create (A07) is a separate mutating step.'
  priority: 50
  iteration: iter-r0
  rbac_op: identity:link
  security:
    catalog_ref: IA-2
    verification_note: IA-2/AC-2 account/identity linkage; AU-2/3/12 admin actions. ASD STIG V6R4 V-222542 / V-222407.
- uid: A07
  base_uid: A07
  version_n: 0
  status: active
  statement: 'A project admin grants a role on a project to an identity. ReqAML creates a project_grant row and audits

    the grant (actor, subject, role, project). Duplicate active grants for the same identity+role are rejected.

    Effective permissions are evaluated on every subsequent mutating API call.'
  priority: 50
  iteration: iter-r0
  rbac_op: project:grant:create
  security:
    catalog_ref: AC-2
    verification_note: AC-2/AC-3/AC-6 grant administration. ASD STIG V6R4 V-222542 / V-222467 / V-222429.
- uid: A08
  base_uid: A08
  version_n: 0
  status: active
  statement: 'A project admin revokes a project role from an identity. ReqAML removes or tombstones the grant and audits

    the revocation. Active sessions for the subject lose the role on the next authorization check;

    desk attachments that required the role are detached.'
  priority: 50
  iteration: iter-r0
  rbac_op: project:grant:revoke
  security:
    catalog_ref: AC-2
    verification_note: AC-2/AC-3 revoke path; AU-2/3/12. ASD STIG V6R4 V-222467 / V-222407.
- uid: A09
  base_uid: A09
  version_n: 0
  status: active
  statement: 'A client or project admin grants catalog-steward at global, client, or project scope to an identity.

    ReqAML records the steward grant at the requested catalog scope and audits actor, subject, and scope.

    Only stewards may mutate non-standard catalog entries at their scope; standard catalogs remain read-only.'
  priority: 55
  iteration: iter-r1
  rbac_op: catalog:steward:grant
  security:
    catalog_ref: AC-2
    verification_note: AC-2 account management for steward roles; AU-2/3/12. ASD STIG V6R4 V-222407 / V-222467.
- uid: A10
  base_uid: A10
  version_n: 0
  status: active
  statement: 'An admin revokes a catalog-steward grant. ReqAML tombstones the steward grant and audits the revocation.

    The subject immediately loses mutate rights on catalogs at that scope; browse/reference of standards remains allowed per Reader rules.'
  priority: 55
  iteration: iter-r1
  rbac_op: catalog:steward:revoke
  security:
    catalog_ref: AC-2
    verification_note: AC-2/AC-3 steward revoke; AU-2/3/12. ASD STIG V6R4 V-222467.
- uid: A11
  base_uid: A11
  version_n: 0
  status: active
  statement: 'A project admin or auditor lists who has access to a project. ReqAML returns identity display names,

    emails, and active roles filtered by the caller''s permission to view grants.

    The response is read-only and does not expose other projects'' grant tables.'
  priority: 45
  iteration: iter-r1
  rbac_op: project:grant:list
  security:
    catalog_ref: AC-3
    verification_note: AC-3 least disclosure of grant listings; AU optional. ASD STIG V6R4 V-222430.
- uid: A12
  base_uid: A12
  version_n: 0
  status: withdrawn
  statement: 'Break-glass impersonation was considered for support scenarios. The design rejects in-product impersonation

    for R0–R1; support uses IdP break-glass outside ReqAML if ever needed.'
