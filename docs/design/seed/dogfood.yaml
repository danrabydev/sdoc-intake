- uid: ARCH-AUTH-AS
  base_uid: ARCH-AUTH-AS
  version_n: 0
  status: active
  statement: ReqAML includes its own OAuth 2.1 authorization server (AS) and it is the single token issuer for the Web UI, API, and MCP clients. It runs in the app container's API role. Only the authorization code grant with PKCE is supported for user-delegated access (no implicit, no resource-owner password grant). The AS conforms to the MCP authorization specification (OAuth 2.1, RFC 8414, RFC 9728, RFC 8707, RFC 9207 iss). Users authenticate at the AS either with a local account (ARCH-AUTH-LOCAL) or through a federated enterprise IdP (ARCH-AUTH-FEDERATION); either way the API and MCP server only accept tokens issued by this AS. Signing uses KeyProvider keys (ARCH-KEY-JWKS), and every auth event is audited (ARCH-CRED-AUDIT).
  priority: 5
  iteration: iter-r1
  rbac_op: auth:oauth:authorize, auth:oauth:token
  security:
    catalog_ref: IA-2
    verification_note: IA-2/IA-5/IA-8/SC-23; single issuer for UI, API, MCP. ASD V-222522.
  grooming_state: detailed
- uid: ARCH-AUTH-PKCE
  base_uid: ARCH-AUTH-PKCE
  version_n: 0
  status: active
  statement: The authorization endpoint requires PKCE with code_challenge_method=S256. Requests that use plain or omit the challenge are rejected (invalid_request) and no code is issued. AS metadata advertises code_challenge_methods_supported=["S256"]. Authorization codes are single-use and short-lived, bound to client_id, redirect_uri (exact match), and code_challenge. State is required, and the authorization response carries iss (RFC 9207).
  priority: 5
  iteration: iter-r1
  rbac_op: auth:oauth:authorize
  security:
    catalog_ref: IA-2.8
    verification_note: Replay-resistant authentication (IA-2(8)); ASD V-222530 / V-222531.
  grooming_state: detailed
- uid: ARCH-AUTH-METADATA
  base_uid: ARCH-AUTH-METADATA
  version_n: 0
  status: active
  statement: 'The AS publishes Authorization Server Metadata (RFC 8414) at /.well-known/oauth-authorization-server, plus OpenID Connect discovery for interop. The metadata issuer is identical to the issuer URL. The MCP server and the API each publish OAuth Protected Resource Metadata (RFC 9728) at /.well-known/oauth-protected-resource, listing the internal AS in authorization_servers and stating their canonical resource URI. A request without a valid token gets 401 with WWW-Authenticate: Bearer resource_metadata="…" so MCP clients can discover the AS.'
  priority: 5
  iteration: iter-r1
  security:
    catalog_ref: REQALM-SEC-OAUTH
    verification_note: MCP authorization spec discovery (RFC 8414 / RFC 9728). Interop requirement; no direct NIST pin.
  grooming_state: detailed
- uid: ARCH-AUTH-AUDIENCE
  base_uid: ARCH-AUTH-AUDIENCE
  version_n: 0
  status: active
  statement: Clients send the RFC 8707 resource parameter on both authorization and token requests. Access tokens are audience-bound to exactly one canonical resource (the API or the MCP server). Each resource server rejects tokens whose audience is not its own (401 invalid_token). The MCP server never passes the token it received through to the API. Downstream API calls use a separately issued API-audience token for the same subject; that mechanism is an open question. RBAC (ARCH-API-RBAC / MC03) still decides every operation after the audience check.
  priority: 5
  iteration: iter-r1
  rbac_op: auth:token:validate
  security:
    catalog_ref: SC-23
    verification_note: SC-23 session authenticity; AC-3 enforcement at each resource server.
  grooming_state: detailed
- uid: ARCH-AUTH-REFRESH
  base_uid: ARCH-AUTH-REFRESH
  version_n: 0
  status: active
  statement: 'Refresh tokens rotate on every use: the AS issues a new refresh token, invalidates the old one, and keeps them in one token family. Presenting an already-rotated refresh token is treated as theft: the AS returns invalid_grant, revokes the whole family (and derived access tokens where introspectable), and emits an audit event. Refresh tokens are bound to client_id and resource, stored hashed server-side (ARCH-CRED-TOKENS), and their idle and absolute lifetimes are configurable.'
  priority: 5
  iteration: iter-r1
  rbac_op: auth:oauth:token
  security:
    catalog_ref: SC-23
    verification_note: SC-23 / IA-5 authenticator protection; replay-resistant refresh.
  grooming_state: detailed
- uid: ARCH-AUTH-REVOKE
  base_uid: ARCH-AUTH-REVOKE
  version_n: 0
  status: active
  statement: The AS exposes token revocation (RFC 7009) for refresh and access tokens. Sign-out (A02) revokes the session's refresh tokens and desk attachments. Disabling or deleting an account, or revoking a grant that removes all access, terminates that subject's sessions and token families. Resource servers reject revoked tokens through introspection or short access-token lifetimes plus revocation checks.
  priority: 10
  iteration: iter-r1
  rbac_op: auth:oauth:revoke, auth:signout
  security:
    catalog_ref: AC-12
    verification_note: AC-12 session termination; ASD V-222549 / V-222578 / V-222391.
  grooming_state: detailed
- uid: ARCH-AUTH-CLIENTREG
  base_uid: ARCH-AUTH-CLIENTREG
  version_n: 0
  status: active
