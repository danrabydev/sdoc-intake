  version_n: 0
  status: active
  statement: 'Sensitive actions require recent authentication (step-up): line or tree approve (D12/D13), capability approve, ConformsTo pin apply/deny, gate sign-off, release ship, grant and role administration, client registration, and key operations. If auth_time is older than the configured max_age, or MFA is missing for a privileged slot, the action returns a step-up challenge and nothing is written.'
