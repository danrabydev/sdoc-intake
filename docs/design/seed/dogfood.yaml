  base_uid: D06
  version_n: 0
  status: active
  statement: 'A Reader views lineage for a UID — all version_n rows for the base_uid with statuses and timestamps.

    The lineage view supports navigation used by mockup 04 (requirement lineage / versions).'
  priority: 25
  iteration: iter-r0
  rbac_op: requirement:version:lineage
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: D07
  base_uid: D07
  version_n: 0
