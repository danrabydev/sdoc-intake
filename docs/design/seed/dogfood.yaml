catalogs:
- id: cat-nist-global
  scope: global
  client_id:
  project_id:
  title: NIST SP 800-53 Rev5 (authoritative .sdoc)
  is_standard: true
  notes: Authoritative control text and UIDs live in catalog/nist-800-53.sdoc (imprint nist-800-53@rev5-dogfood-20261006). YAML does not hold NIST library text. Product ConformsTo pins are (catalog_imprint_id, item_uid) e.g. (nist-800-53@rev5-dogfood-20261006, AC-3). Do not rewrite published imprint rows in place.
  entries: []
  sdoc_path: catalog/nist-800-53.sdoc
  current_imprint_id: nist-800-53@rev5-dogfood-20261006
- id: cat-reqalm-security
  scope: project
  client_id: raby-family
  project_id: reqalm
  title: ReqALM project security catalog
  is_standard: false
  entries:
  - id: REQALM-SEC-SSO
    title: Enterprise SSO only (no local passwords)
  - id: REQALM-SEC-SCOPE
    title: Server-side client scoped view
  - id: REQALM-SEC-RBAC
    title: Permission checks on every mutating API
  - id: REQALM-SEC-MCP
    title: MCP desk OC-style session sealing; mutations on HTTPS only
  - id: REQALM-SEC-AUDIT
    title: OTEL-exported audit for security-relevant actions
  - id: REQALM-SEC-CATALOG
    title: Standard catalog reference without copy; steward-gated edits
  - id: REQALM-SEC-OAUTH
    title: Internal OAuth 2.1 AS is the single token issuer for UI, API, and MCP (PKCE S256, audience-bound tokens)
  - id: REQALM-SEC-CRED
    title: 'Credential store controls: salted one-way hashes, lockout, MFA for privileged roles, hashed server-side tokens'
  - id: REQALM-SEC-KEYS
    title: Envelope encryption under an external KeyProvider (OpenBao Transit default); custodian-gated key ops
  notes: 'Project catalog (REQALM-SEC-*): steward-mutable without an imprint until publish. Standards always require imprint publish (H03 / ARCH-CAT-SCOPE).'
- id: cat-stig-asd-v6r4
  scope: global
  client_id:
  project_id:
  title: DISA ASD STIG V6R4 (authoritative .sdoc)
  is_standard: true
  notes: Authoritative rule text and UIDs live in catalog/asd-stig-v6r4.sdoc (imprint asd-stig@v6r4). Product ConformsTo pins are (catalog_imprint_id, item_uid) e.g. (asd-stig@v6r4, V-222536).
  entries: []
  sdoc_path: catalog/asd-stig-v6r4.sdoc
  current_imprint_id: asd-stig@v6r4
