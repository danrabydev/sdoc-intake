  priority: 15
  iteration: iter-r0
  rbac_op: requirement:tree:read
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: C07
  base_uid: C07
  version_n: 0
  status: active
  statement: 'A Reader expands, collapses, or filters the tree by kind, status, text, or approval state. Filtering is a view concern; it does not mutate lines. Filters honor Scoped View and RBAC so unauthorized lines never appear. Approval filter (ARCH-APPROVAL-VIEW) shows unapproved versions as the primary tree; approved ones are dimmed/collapsed — same pattern as other filtered trees (status/kind).'
  priority: 40
  iteration: iter-r0
  rbac_op: requirement:tree:filter
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: C08
  base_uid: C08
  version_n: 0
  status: active
  statement: 'A Reader searches requirement statements and titles within the scoped client/project. ReqAML returns

    matching version UIDs with snippets; search never crosses clients even if the caller has multi-client grants.'
  priority: 20
  iteration: iter-r1
  rbac_op: requirement:search
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: D01
  base_uid: D01
  version_n: 0
  status: active
  statement: 'An Author creates the first requirement_version for a line (version_n 0, uid = base_uid). ReqAML stores

    statement, status (typically draft), and optional priority/iteration/rbac_op/security metadata.

    No in-place overwrite of a published version is allowed afterward — successors use .N.'
  priority: 10
  iteration: iter-r0
  rbac_op: requirement:version:create
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: D02
  base_uid: D02
  version_n: 0
  status: active
  statement: 'An Author creates a successor version with version_n = prior+1 and uid base_uid.N. ReqAML copies or

    drafts new statement content; prior versions remain immutable rows. Children stay on the parent line

    (parent = base_uid); there is no cascade fork.'
  priority: 10
  iteration: iter-r0
  rbac_op: requirement:version:succeed
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: D03
  base_uid: D03
  version_n: 0
  status: active
  statement: 'An Author edits fields on a draft version (statement, metadata). ReqAML allows mutation only while

    status is draft; active/obsolete/withdrawn rows are immutable and require a successor for changes

    (FIX-DENY-EDIT-ACTIVE, CM-3). Draft updates are audited.'
  priority: 15
  iteration: iter-r0
  rbac_op: requirement:version:update_draft
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: D04
  base_uid: D04
  version_n: 0
  status: active
  statement: 'An Author or Project admin marks a draft version active (lifecycle status only). ReqAML transitions status to active and, in the SAME transaction, sets any prior active version of the same line to superseded IN PLACE (not a new version) so the ≤1-active invariant holds (ARCH-VER / FIX-DENY-SECOND-ACTIVE). Activation is audited. IMPORTANT: activate (D04) is NOT stakeholder approval — approval is ApprovalRecord on the line (ARCH-APPROVAL-LINE / D12). An active but unapproved / planning_blocked line cannot receive priority mutate (D08).'
  priority: 20
  iteration: iter-r0
  rbac_op: requirement:version:activate
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: D05
  base_uid: D05
  version_n: 0
  status: active
  statement: 'An Author marks content obsolete or withdrawn. Terminal obsolete/withdraw WITHOUT a replacement tip is an in-place status change on the current tip (or a status-only .N with mint_kind=status, exempt from content no-op and NOT clearing ApprovalRecord). When a replacement tip exists, the prior tip becomes superseded via D04 activate — not a separate obsolete successor required for every replacement. Tombstoned lines disappear from default tree views. Soft-delete remains auditable (ARCH-VER-TOMB / AU-12).'
  priority: 35
  iteration: iter-r1
  rbac_op: requirement:version:obsolete
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
