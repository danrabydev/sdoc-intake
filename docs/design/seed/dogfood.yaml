- uid: ARCH-ATTACH
  base_uid: ARCH-ATTACH
  version_n: 0
  status: draft
  priority: 10
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:read
  statement: 'ReqALM stores file attachments (bytes in an object store, metadata in Postgres) on exactly one parent: a client, a project, a requirement version, a capability version, a release, a contract, or a catalog control within a project-owned catalog imprint. Attachments are never parented to trace edges, approval records, gate signoffs, change sets, audit events, or controls in a standard (shared) imprint; evidence for those is attached to the owning version, release, or contract and referenced by id. Every attachment row carries client_id and project_id (null only for client-level), and all reads and writes enforce ARCH-CP-SCOPE. Attachments are soft-deleted (deleted_at, deleted_by) and hidden from default lists; bytes are retained for auditors. Permanent wipe of a restricted or legally held attachment is a separate Client admin operation (attachment:wipe) that needs step-up re-authentication and writes an audit row; it never runs from the normal delete path.'
  statement_hash: sha256:042707b8358073b5a423ba24c0f37ff6dcd150ec52c2f95e0c743238eb3f5f03
  security:
    catalog_ref: AC-3
    verification_note: 'Cyber 2026-10-09 attachments-figma mapping; Umbrella. Valid parents: client, project, requirement version, capability version, release, contract, catalog control (project-owned imprint only). Not: trace edges, approvals/gate_signoffs, audit_events, change_sets.'
- uid: ARCH-ATTACH-PIN-VERSION
  base_uid: ARCH-ATTACH-PIN-VERSION
  version_n: 0
  status: draft
  priority: 10
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:read
  statement: 'An attachment on a requirement or capability binds to that exact version uid, never to the line. A new version (.N) starts with no attachments; the author may carry selected attachments forward explicitly, which creates new rows that reference the same content sha256 and record carried_from. Attachments on a shipped or locked version are append-only: they can be added (as later evidence) but not replaced or soft-deleted except by attachment:wipe. Adding or removing an attachment is not a content mint and does not change statement_hash, but it flags needs re-check on the version''s verification. Clients, projects, releases, contracts, and catalog controls have no versions; attachments bind to them directly, and attachments on a shipped release or signed contract are append-only.'
  statement_hash: sha256:7128a72a570b3ed156155c9458300c4a152e8a2eee51f81ab2d26eac77ceb957
  security:
    catalog_ref: CM-3
    verification_note: 'Cyber 2026-10-09 attachments-figma mapping; Version pinning matches the mint rule (ARCH-MINT-KIND, ARCH-LOCKED): evidence is immutable once shipped.'
- uid: ARCH-ATTACH-SCOPE
  base_uid: ARCH-ATTACH-SCOPE
  version_n: 0
  status: draft
  priority: 5
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:read
  statement: 'Access to an attachment follows its parent object''s scope and role permissions at every parent level: listing or downloading requires the read permission of the parent as granted by the caller''s role (client read for a client-level attachment, project read for a project, requirement:read for a requirement version, and so on), checked server-side on every request; creating or deleting requires the parent''s write-level permission plus attachment:create. There is no attachment-specific grant model. If the caller cannot read the parent, or the parent or attachment is restricted for the caller, or the attachment is soft-deleted, the response is the same 404 as a nonexistent id, with no difference in body, headers, or timing class. Attachment ids are server-generated and must match the allowlist ^att_[0-9a-z]{26}$; any other value is rejected with 400 before any lookup, and the raw value is not logged (logs record a redacted placeholder). List responses return metadata only: id, sanitized display name, size in bytes, media type (as detected), sha256, scan state, uploaded_by identity_id, created_at. They never return storage keys, object-store URLs, or content.'
  statement_hash: sha256:206d28dc0dd2808362ed1d8c54c826a0412106f8e9ba5a9658fa34b6308b99b5
  security:
    catalog_ref: AC-3
    verification_note: Cyber 2026-10-09 attachments-figma mapping; Same-404 rule as restricted relations (ARCH-SEC-REL-STUB, ARCH-SEC-XPROJ-READ).
- uid: ARCH-ATTACH-AUDIT
  base_uid: ARCH-ATTACH-AUDIT
  version_n: 0
  status: draft
  priority: 5
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:read
  statement: 'Every attachment download, upload, carry-forward, soft delete, and wipe, whether allowed or denied, writes one append-only audit_events row with: actor identity_id, client_id, project_id, action, attachment id, parent ref (kind and uid), content sha256, outcome, and trace_id. Audit rows never contain file content, file names supplied by the user before sanitization, or storage keys. List calls are audited as one row per request, not per item. Audit writes go through the write unit of work; if the audit row cannot be written, the download is refused.'
  statement_hash: sha256:d8943b3f16f0e39fb07d8959b7fffb5662cf6be90779ec8594f4fb9929a5a7e2
  security:
    catalog_ref: AU-2
    verification_note: Cyber 2026-10-09 attachments-figma mapping; Object-access audit per STIG V-222465.
- uid: ARCH-ATTACH-SERVE
  base_uid: ARCH-ATTACH-SERVE
  version_n: 0
  status: draft
  priority: 5
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:read
  statement: 'Attachment bytes are served only from a dedicated download route with Content-Disposition: attachment and an RFC 6266 filename (ASCII fallback plus filename* UTF-8 percent-encoding, with path separators, control characters, and quotes removed), Content-Type set from the detected type (application/octet-stream when unknown or not on the allowlist), X-Content-Type-Options: nosniff, Content-Security-Policy: sandbox; default-src ''none'', Cache-Control: private, no-store, and Cross-Origin-Resource-Policy: same-origin. The UI never renders attachment content inline (no img, iframe, object, or embed of the raw bytes). SVG, HTML, XML, and other active-content types are always served as application/octet-stream downloads. Before returning bytes, the server recomputes sha256 and compares it with the stored value; a mismatch returns an error, is audited, and marks the attachment integrity_failed.'
  statement_hash: sha256:41132fbbd65faf2030219be048d87ae7e3c7157562b56a731c2b370dbe7ec4ea
  security:
    catalog_ref: SI-10
    verification_note: Cyber 2026-10-09 attachments-figma mapping; Stored-XSS containment; extends ARCH-SEC-HEADERS.
- uid: ARCH-ATTACH-UPLOAD
  base_uid: ARCH-ATTACH-UPLOAD
  version_n: 0
  status: draft
  priority: 20
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:create
  statement: Uploading requires attachment:create on the parent's project, which is separate from read and is granted to Author and above. Upload is a same-origin POST protected by the session CSRF defenses (ARCH-SEC-HEADERS, SameSite cookies, Origin check). The server rejects any file larger than 25 MB (26,214,400 bytes) and any upload that would take the project's total attachment storage above 5 GB (5,368,709,120 bytes), counting soft-deleted attachments until wiped, before accepting the bytes. The type is decided from magic bytes against an allowlist (initially PDF, PNG, JPEG, plain text, CSV, and Office Open XML), never from the extension or client Content-Type; a mismatch is rejected with 400. Accepted files enter quarantine and become available only per ARCH-ATTACH-SCAN.
  statement_hash: sha256:db561fb65a04fb515795ade7b2c73bccb9c419a0248d166571ec12ea037e69b3
  security:
    catalog_ref: SI-10
    verification_note: Cyber 2026-10-09 attachments-figma mapping; Write phase (later). Scanning is in ARCH-ATTACH-SCAN.
- uid: ARCH-ATTACH-ENCRYPT
  base_uid: ARCH-ATTACH-ENCRYPT
  version_n: 0
  status: draft
  priority: 20
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:create
  statement: Each attachment object is encrypted at rest with its own data encryption key (AES-256-GCM); the DEK is wrapped by the KeyProvider KEK (ARCH-KEY-PROVIDER) and stored beside the metadata row, scoped to the client. Plaintext DEKs exist only in memory for one request. If the KeyProvider is unavailable, uploads and downloads fail closed (ARCH-KEY-FAILCLOSED). Wipe destroys the wrapped DEK as well as the object (crypto-shred). Object-store credentials are held in the key store and never logged.
  statement_hash: sha256:ac68298b2022706899f98dce167f3e3a3fe71c57bf38055048d1c4611b84f27c
  security:
    catalog_ref: SC-28
    verification_note: Cyber 2026-10-09 attachments-figma mapping; Extends ARCH-KEY-SCOPE item list with attachment DEKs.
- uid: ARCH-FIGMA
  base_uid: ARCH-FIGMA
  version_n: 0
  status: draft
  priority: 30
  iteration: iter-r2
  grooming_state: want
  rbac_op: figma:link
  statement: 'A capability or requirement version may link to Figma nodes by file key and node id (file, frame, or component). Linked ids must match ^[A-Za-z0-9]{10,128}$ (file key) and ^[0-9]+[:-][0-9]+(;[0-9]+[:-][0-9]+)*$ (node id); anything else is rejected with 400. Previews are fetched server-side from api.figma.com, rasterized to PNG, cached per project, and served same-origin as images through ARCH-ATTACH-SERVE rules (images only); the UI does not embed Figma iframes or load third-party scripts, and CSP frame-src stays ''none''. A link records the node''s lastModified/version at link time; when the server observes a newer value (scheduled polling, or a Figma webhook whose signature/passcode is verified before processing), the link and its version are flagged needs re-check. Figma content returned to ReqALM is untrusted input: names are sanitized and length-capped, and nothing returned is executed or rendered as HTML.'
  statement_hash: sha256:0663cbd2966235e887892c5c78849cb3502df72dbec394dbaf18e2b1af4b5fba
  security:
    catalog_ref: SA-9
    verification_note: Cyber 2026-10-09 attachments-figma mapping; Draft, needs-spike (SPIKE-FIGMA-FEASIBILITY); external service integration. Figma is an external system (AC-20, SA-9, CA-3).
- uid: ARCH-FIGMA-AUTH
  base_uid: ARCH-FIGMA-AUTH
  version_n: 0
  status: draft
  priority: 30
  iteration: iter-r2
  grooming_state: want
  rbac_op: figma:connection:admin
  statement: Each project connects to Figma separately, which requires figma:connection:admin (Project admin) and step-up re-authentication, and is audited. The connection uses OAuth 2.0 authorization code with PKCE (S256) and the minimum read-only scopes needed (file content read, plus webhooks only if enabled). Access and refresh tokens are encrypted at rest under the KeyProvider (ARCH-KEY-SCOPE.1), refresh tokens are rotated on use, and a connection is revoked by setting revoked_at and calling the provider's revocation endpoint where supported. Tokens are never logged, never returned to the browser or MCP clients, and never placed in URLs. Outbound HTTP is restricted to an allowlist (api.figma.com, www.figma.com for the OAuth endpoints) over TLS with certificate validation.
  statement_hash: sha256:7b59325dac73890836a62d7b786de50125b36ccca90172dd8151c82fcdd9f80b
  security:
