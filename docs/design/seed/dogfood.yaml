  priority: 35
  iteration: iter-r0
  rbac_op: requirement:line:retitle
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: C03
  base_uid: C03
  version_n: 0
  status: active
  statement: 'An Author moves a line to a new parent within the same project. ReqAML updates parent to the target

