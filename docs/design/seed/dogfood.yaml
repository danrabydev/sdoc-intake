- uid: ARCH-TRACE-INHERIT-USES
  base_uid: ARCH-TRACE-INHERIT-USES
  version_n: 0
  status: draft
  statement: |-
    A provider capability version may mark any of its conforms_to pins inheritable (common control, NIST SP 800-53 Rev. 5 PL-2/PM-10 common-control designation). A consumer capability version that uses the provider inherits each inheritable pin and shows it as "inherited via uses <provider>". Rules: (1) Only capability-to-capability uses edges carry inheritance; uses edges from or to requirement lines remain dependency-only per ARCH-HIER-USES-DEP. (2) Only pins on the provider line's current active version that is shipped or verification_outcome=pass are inheritable; draft, superseded, obsolete or withdrawn provider versions supply nothing. (3) A control whose provider verification is fail, pending, or not assessed is not inherited; the consumer shows it "provider not-pass" and the control stays incomplete for the consumer. (4) Inheritance is one hop. A provider re-exports a control it inherited only when its own conforms_to pin for that control is marked inheritable (that is, it takes ownership of the control). (5) Any content, status, or verification change on the provider line, or a change to its inheritable set, flags needs re-check (trace_suspect) on every consumer for the affected controls only, per ARCH-TRACE-RECHECK. (6) Cross-project or restricted providers follow existing scope rules: a consumer without read grant on the provider project sees the inherited control id and the state "inherited (provider restricted)", but not the provider uid, statement, or evidence.
  priority: 15
  iteration: iter-r1
  security:
    catalog_ref: PL-2
    verification_note: Cyber 2026-10-09 inherit-uses mapping; common-control model per SP 800-53 Rev5 PL-2, PM-10, CA-2, SA-9.
  statement_hash: sha256:f5ceaff40f763c63a433b9b052dea088bf102b586d6947bbf9914ee8c46996ca
  grooming_state: detailed
  rbac_op: trace:edit
- uid: ARCH-TRACE-INHERIT-HYBRID
  base_uid: ARCH-TRACE-INHERIT-HYBRID
  version_n: 0
  status: draft
  statement: |-
    When a consumer capability both inherits a control via uses and has its own direct conforms_to pin for the same control, the control is hybrid for that consumer: the provider supplies the shared part and the consumer adds or overrides the rest (for example a custom session timeout). The consumer's direct pin wins for display and for the consumer's verification state, labeled "hybrid (via <provider>)". Hybrid counts once per consumer and control. A provider change still flags the hybrid control for re-check on the consumer. Removing the direct pin returns the control to inherited; removing the provider inheritable mark returns it to direct-only.
  priority: 15
  iteration: iter-r1
  security:
    catalog_ref: CA-2
    verification_note: Cyber 2026-10-09; hybrid control per SP 800-53 Rev5 PL-2 discussion (common, hybrid, system-specific).
  statement_hash: sha256:59044cbac6b9dc016d7de96e74d8062450c4859da2426db7dbe7c90859bf52b5
  grooming_state: detailed
  rbac_op: trace:edit
