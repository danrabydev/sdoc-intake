  base_uid: C01
  version_n: 0
  status: active
  statement: 'An Author creates a section, requirement, control, or capability line under a parent line (or as a root

    section). ReqAML inserts a requirement_line with stable base_uid, kind, and title; parent is always a line

    base_uid (or null). Creating a line does not create a version until the author adds first content (D01).'
  priority: 10
  iteration: iter-r0
  rbac_op: requirement:line:create
