- uid: B07
  base_uid: B07
  version_n: 0
  status: active
  statement: 'An authenticated user lists clients they are allowed to see. ReqAML returns only clients where the

    caller has a grant or client-admin binding — never a global client dump for ordinary users.'
  priority: 25
  iteration: iter-r0
  rbac_op: client:list
