  priority: 30
  iteration: iter-r1
  rbac_op: requirement:line:move
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: C04
  base_uid: C04
  version_n: 0
  status: active
  statement: 'An Author reorders sibling lines under the same parent. ReqAML persists sibling order for outline and

