  version_n: 0
  status: active
  statement: Approval grain is the requirement/capability LINE. ApprovalRecord stores status, by, at, notes, approved_version_uid, and approved_statement_hash. Tree UI batches many ApprovalRecords in one change set (Approve = line+direct children; Approve Tree = full descendants). Supersedes version-only wording; reconcile D08/D12/ARCH-APPROVAL to line grain + profile hooks. Version stakeholder_approval may dual-write as mirror.
