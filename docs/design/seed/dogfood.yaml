- uid: ARCH-CRED-SESSION
  base_uid: ARCH-CRED-SESSION
  version_n: 0
  status: active
  statement: 'Sessions use system-generated unique identifiers from an approved RNG and rotate on login (anti-fixation). Session IDs are never in URLs or otherwise exposed. Cookies are HttpOnly and Secure, sessions are validated server-side, and IDs are never reused. Idle and absolute timeouts are configurable (DoD preset: 15 minutes idle non-privileged, 10 minutes admin), as are concurrent-session limits. Timeout, sign-out, and account deletion destroy the session and its token family. Session create, renew, timeout, and destroy are audited.'
