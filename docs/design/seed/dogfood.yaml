- uid: ARCH-DEPLOY-MINIMAL
  base_uid: ARCH-DEPLOY-MINIMAL
  version_n: 0
  status: active
  statement: 'One Dockerfile with multi-stage targets (app, peripherals, optional hsm-test) builds every ReqAML image. A single app container runs the API (including the internal OAuth AS), Web UI (static assets served by the API role), MCP server (Streamable HTTP), and sync worker together, as one Node process or under a lightweight supervisor. Roles are toggled by env/config (for example REQAML_ROLES=api,web,mcp,sync), so any role can later run as its own container from the same image without a rebuild, and health/readiness is reported per enabled role. Rationale (Dan, 2026-10-07): run as few containers as possible for fast clone-to-running and small deployments. C4 L2 containers are logical runtime containers, not mandated deploy units.'
  priority: 5
  iteration: iter-r0
  security:
    catalog_ref: CM-2
    verification_note: 'CM-2 baseline: one Dockerfile + role config is the deployable baseline; CM-7 roles off when not needed.'
  grooming_state: detailed
- uid: ARCH-DEPLOY-PERIPHERALS
  base_uid: ARCH-DEPLOY-PERIPHERALS
  version_n: 0
  status: active
  statement: 'Peripherals run in as few containers as is sensible. Dev/test: one peripherals container (Dockerfile peripherals target) runs Postgres and OpenBao under a lightweight supervisor, each with its own named volume. Co-locating them in dev is acceptable because dev keys are dev-only and protect no real data, and separate volumes keep reset and backup independent. Production: Postgres and OpenBao are separate deploy units with separate host, volume, and backup set. Rationale: envelope encryption protects data only if the KEK store does not share a compromise domain or backup set with the database whose DEKs it wraps (ARCH-KEY, SC-28(3)), and the two have different durability models (database backups/PITR versus OpenBao seal plus snapshots). SoftHSM2 is a PKCS#11 library loaded in-process, so it is not a peripheral container: it is an optional app hsm-test target and is never deployed. Reference topology: dev 2 containers (app + peripherals); prod 3 units (app, Postgres, OpenBao).'
  priority: 5
  iteration: iter-r0
  security:
    catalog_ref: SC-28.3
    verification_note: SC-28(3) key storage separated from protected data in prod; CP-9 independent backups.
  grooming_state: detailed
