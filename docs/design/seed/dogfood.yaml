- uid: ARCH-ATTACH-SCAN
  base_uid: ARCH-ATTACH-SCAN
  version_n: 0
  status: draft
  priority: 20
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:create
  statement: Every uploaded attachment is scanned through a pluggable scanner interface scan(stream) -> clean | infected | error, and each result records the engine name, engine version, and signature version. A new attachment stays in scan_state pending (quarantined) and cannot be listed as available or downloaded until a scan returns clean. An error or timeout leaves it quarantined (fail closed) and it may be retried. An infected attachment moves to scan_state infected, is never served, stays quarantined, and is retained per the soft-delete rule (ARCH-ATTACH) until wiped. Every scan result is written as an audit_events row (attachment id, parent ref, sha256, result, engine and signature version) and an infected result raises an alert. Rescanning clean attachments after a signature update is optional per deployment. The ClamAV (clamd) adapter is allowed in development only; production scanner selection is deferred, and production startup refuses to start with the dev adapter unless an operator explicitly configures it.
  statement_hash: sha256:1d72092862ba6934b6fe8239b0d8abb000493703838f96416638c65744009440
