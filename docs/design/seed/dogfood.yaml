- uid: ARCH-CRED-HASH
  base_uid: ARCH-CRED-HASH
  version_n: 0
  status: active
  statement: 'Local passwords are stored only as salted, approved one-way hashes with a per-credential random salt. Algorithm and cost parameters are configuration, not a hard-coded library: Argon2id where FIPS mode is not required, PBKDF2-HMAC-SHA-256/512 (FIPS-approved) where FIPS-validated crypto is required (ARCH-KEY-FIPS). Each stored hash records its algorithm and parameters, and an outdated hash is re-hashed on the next successful login. Passwords travel only over TLS and are never displayed or logged.'
  priority: 5
  iteration: iter-r1
  rbac_op: auth:local:signin
