  version_n: 0
  status: active
  statement: statement_hash is the canonical hash of the STATEMENT BODY ONLY (trim whitespace; normalize newlines to \n; no status, pins, or security metadata in the hash — ARCH-MINT-KIND). Minting a successor .N with mint_kind=content ALWAYS clears the line ApprovalRecord to unapproved and sets planning_blocked until re-approve. Same statement_hash content mint is BLOCKED (gate-noop-successor-block / FIX-DENY-NOOP-CONTENT) — no-op content mint must not launder a clear. mint_kind=pin clears approval (locked migrate also needs gate_signoff then re-approve). mint_kind=status|security_meta do NOT clear approval (audit only). After clear, explicit approve is required again even if a later edit restores a prior hash (default).
  priority: 10
  iteration: iter-r0
  rbac_op: requirement:version:mint
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
