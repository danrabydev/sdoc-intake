  version_n: 0
  status: active
  statement: Password and authenticator policy (minimum length, composition or blocklist, change distance, minimum and maximum lifetime, reuse history, temporary password with forced change) is a configurable preset per deployment. The DoD-facing preset meets ASD STIG V6R4 values. Default and seeded credentials must be changed before first use, and production must not contain any.
