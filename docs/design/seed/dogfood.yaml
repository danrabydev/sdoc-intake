  status: active
  statement: Closed (and open) change sets are retained forever for audit — no TTL deletion in product policy. Status may move to reverted or abandoned; records are never deleted. Authorized roles (M07) may revert only the latest change set on the project stack (ARCH-CHANGESET-CONFLICT). Re-apply restores a previously reverted tip when still latest. Older whole-set undo is via abandon of that set and every later set — not selective mid-stack revert. Field-level history undo is deferred (WANT-CHANGESET-FIELD-UNDO).
  priority: 20
