- uid: ARCH-REQ-AC-FACET
  base_uid: ARCH-REQ-AC-FACET
  version_n: 0
  status: active
  statement: An acceptance criterion (facet) is a verifiable condition attached to exactly one requirement version — not a separate requirement line and not a capability line. Facets shall have no independent trace graph; satisfaction is recorded on the parent requirement. Each facet shall use a testable 'shall' statement. A child requirement line (decomposition) is a distinct concept per ARCH-HIER-REQ-DECOMP.
  priority: 15
  iteration: iter-r1
  security:
    catalog_ref: CM-2
    verification_note: Groomed 2026-10-09; pre-write or UI track.
  statement_hash: sha256:ec1cb669899f1d48ab6f3d2886aa07e0c45441807dbf2464fd24a7c0c1d0ad6a
  grooming_state: detailed
  rbac_op: requirement:tree:read
- uid: ARCH-REQ-AC-ROLLUP
  base_uid: ARCH-REQ-AC-ROLLUP
  version_n: 0
  status: active
  statement: 'Requirement completeness shall roll up from acceptance criteria on the parent version: the parent is complete when every attached facet is satisfied; a facet is satisfied when at least one linked capability (or verified implementation) satisfies it. Partial facet satisfaction shall surface as incomplete on the parent.'
  priority: 15
  iteration: iter-r1
  security:
    catalog_ref: CM-2
    verification_note: Groomed 2026-10-09; pre-write or UI track.
  statement_hash: sha256:f6e348e2600ed809122d4d09dc21676249de1b0782503fe10b8fb0d8ce98de64
  grooming_state: detailed
  rbac_op: requirement:tree:read
- uid: ARCH-TRACE-RECHECK
  base_uid: ARCH-TRACE-RECHECK
  version_n: 0
  status: active
  statement: 'Re-check (needs re-check) is a distinct state from incomplete: re-check applies to a criterion, control, or trace target that was previously complete whose conforming capability changed content, lost verification, or regressed. Incomplete means the target was never completed. Re-check shall be represented as trace_suspect (and review queues) separately from incomplete. Audit-sensitive targets — controls in the AU and AC families plus any target the user marks audit-sensitive — shall enter re-check when an upstream satisfying or conforming capability changes. A uses dependency change shall flag dependents for re-check without inheriting controls unless explicitly modeled.'
  priority: 15
  iteration: iter-r1
  security:
    catalog_ref: CM-3
    verification_note: Groomed 2026-10-09; pre-write or UI track.
  statement_hash: sha256:9f1099d15553ba84d33e3da231b9e775072c4c045885578b8efe4d4c6013fcde
  grooming_state: detailed
  rbac_op: trace:suspect
