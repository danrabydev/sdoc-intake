  status: active
  statement: 'Mutating audit is nested under project-scoped change_set records. A change_set may be a leaf (single user save / transaction) or an optional SDLC parent session that nests leaf change sets. Default scope is project; any hierarchy scope is allowed when opening an SDLC parent. audit_events optionally reference change_set_id. Open / close / revert / apply operate at the leaf; SDLC parents open/close as sessions (M05–M07). Closed change sets are retained forever (ARCH-CHANGESET-RETAIN). Revert policy is stack-ordered (ARCH-CHANGESET-CONFLICT / M07): only the latest non-abandoned change set on the stack may be reverted; older whole sets require abandoning that set and everything after it. Field-level history undo is a future want (WANT-CHANGESET-FIELD-UNDO).'
