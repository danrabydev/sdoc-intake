- uid: ARCH-KEY
  base_uid: ARCH-KEY
  version_n: 0
  status: active
  statement: ReqAML's encryption root of trust is an external key / secret store using envelope encryption. A key-encryption key (KEK) is held outside the application database by the KeyProvider and wraps data-encryption keys (DEKs). DEKs are persisted only in wrapped form. Plaintext key material exists only in process memory, is never written to the database, logs, or source, and is zeroized when no longer needed.
  priority: 5
  iteration: iter-r1
  security:
    catalog_ref: SC-12
    verification_note: SC-12 key establishment/management; SC-28(3) cryptographic keys at rest.
  grooming_state: detailed
- uid: ARCH-KEY-PROVIDER
  base_uid: ARCH-KEY-PROVIDER
  version_n: 0
  status: active
  statement: 'Key operations go through a pluggable KeyProvider abstraction: wrap/unwrap DEK, re-wrap, generate, rotate, revoke/disable, destroy, and sign with non-exportable signing keys. The default backend is OpenBao with the Transit engine (envelope encrypt/decrypt/rewrap plus sign) for dev, and it is suitable for production. The same interface also accepts a cloud KMS or an HSM over PKCS#11 (SoftHSM2 is used only to test the PKCS#11 path). HashiCorp Vault (BUSL) and LocalStack KMS are not defaults. Access to the KeyProvider is authenticated with deployment credentials injected at runtime, never committed (ARCH-DEVENV-SECRETS).'
  priority: 5
  iteration: iter-r1
  security:
    catalog_ref: IA-7
    verification_note: IA-7 cryptographic module authentication; ASD V-222555.
  grooming_state: detailed
- uid: ARCH-KEY-SCOPE
  base_uid: ARCH-KEY-SCOPE
  version_n: 0
  status: active
  statement: 'The key store protects: (1) OAuth token signing keys (ARCH-KEY-JWKS); (2) secrets the app must use (DB credentials, SMTP credentials, Azure DevOps connector tokens, upstream IdP client secrets, OTEL sink credentials, MFA secrets), encrypted under DEKs; (3) peppers or HMAC keys used to hash server-side tokens (ARCH-CRED-TOKENS). Verify-only credentials are hashed, not encrypted. Field-level encryption applies only to columns that hold such secrets. Requirement content is not field-encrypted and relies on storage-level encryption at rest per deployment.'
  priority: 10
  iteration: iter-r1
  security:
    catalog_ref: SC-28.1
    verification_note: SC-28(1) cryptographic protection at rest; ASD V-222588 / V-222589 / V-222642.
  grooming_state: detailed
- uid: ARCH-KEY-JWKS
  base_uid: ARCH-KEY-JWKS
  version_n: 0
  status: active
  statement: 'Each token signing key has a kid. By default it is a non-exportable OpenBao Transit key, so signing happens inside the KeyProvider and the kid is the key name plus version. The AS publishes public keys at its jwks_uri for the active key and any retired keys still inside the overlap window. Rotation is scheduled and on demand: a new key version starts signing, the prior version stays verify-only until the overlap window passes (at least the maximum access-token lifetime plus clock skew), and is then removed. After that, tokens with the retired kid are rejected.'
  priority: 5
  iteration: iter-r1
  rbac_op: key:signing:rotate
  security:
    catalog_ref: SC-12.3
    verification_note: SC-12(3) asymmetric keys; SC-13; ASD V-222570.
  grooming_state: detailed
- uid: ARCH-KEY-LIFECYCLE
  base_uid: ARCH-KEY-LIFECYCLE
  version_n: 0
  status: active
  statement: Key lifecycle operations are generate, rotate (scheduled and on demand), revoke/disable, and destroy, for KEKs and DEKs. KEK rotation creates a new key version and re-wraps every DEK online (Transit rewrap, so plaintext is never exposed). Prior versions still unwrap until re-wrap finishes and is verified, then the minimum decryption version is raised to disable them. Reads and writes continue throughout with no downtime. Destroy is irreversible, needs the Key custodian (ARCH-KEY-CUSTODIAN), and requires confirmation that no live ciphertext depends on the key. Every key operation emits an audit event through the AuditLog pattern (operation, key id/version, actor, outcome) and never includes key material.
  priority: 5
  iteration: iter-r1
  rbac_op: key:kek:rotate, key:dek:rewrap, key:revoke, key:destroy
  security:
    catalog_ref: SC-12
    verification_note: SC-12 / SC-12(2) / SC-12(3); AU-2.
  grooming_state: detailed
- uid: ARCH-KEY-CUSTODIAN
  base_uid: ARCH-KEY-CUSTODIAN
  version_n: 0
  status: active
  statement: "Key operations (KEK/DEK rotate, revoke, destroy, provider reconfigure, recovery) need the deployment-scoped Key custodian role. No existing role fits: project and client roles are tenant-scoped, and the permission tree has no ops or deployment role ('No separate Deployer in v1'). For separation of duties, the Key custodian is distinct from Client admin and Project admin, and holding both on one deployment is refused unless a documented exception is approved. The role grants no access to requirement content. Scheduled automatic rotation runs as an audited system principal."
  priority: 10
  iteration: iter-r1
  rbac_op: key:*
