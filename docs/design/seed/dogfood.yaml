  - gate-signoff-complete
  disabled_optional_gates:
  - gate-verification-ship
  - gate-no-open-suspect
  planning_gate_actions:
  - requirement:version:priority
  notes: Dogfood commercial profile. planning_gate_actions lists which planning mutations require gate-line-approved (profile-configurable — not priority-only forever; ARCH-PLANNING-GATES). gate-verification-ship present in catalog but disabled here.
  action_hook_ids:
  - hook-line-approve
  - hook-line-approve-tree
  - hook-cap-approve
  - hook-priority
  - hook-mint
  - hook-cap-create
