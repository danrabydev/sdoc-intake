- uid: CAP-SVC-PROJECT-ID-SLUG
  base_uid: CAP-SVC-PROJECT-ID-SLUG
  version_n: 0
  status: active
  statement: 'The :projectId path param must match ^[a-z0-9][a-z0-9-]{0,63}$ before it becomes project scope. An id that does not (padded, control characters, uppercase, over-long at any length) is not_found after authentication, identical to a missing or ungranted project, and an unauthenticated caller gets the same 401 as for a valid id, before any validation detail. An invalid id is never recorded raw: audit_events.project_id is NULL, no reqalm.project_id span attribute is set, and request logs and exported span URL attributes show the segment as [invalid].'
  priority: 10
