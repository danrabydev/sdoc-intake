gates:
- id: gate-line-approved
  subject_kinds:
  - RequirementLine
  - RequirementVersion
  mode: required
  predicate: subject.approval.status == approved
  approver_slots:
  - stakeholder
  on_fail: deny
  deny_fixture: FIX-DENY-PRIORITY-UNAPPROVED
  notes: D08 and other profile-selected planning actions require line ApprovalRecord.
- id: gate-cap-approved
  subject_kinds:
  - CapabilityLine
  mode: required
  predicate: subject.approval.status == approved
  approver_slots:
  - solution_approver
  on_fail: deny
  notes: CapabilityLine ApprovalRecord accepts solution; Satisfies edge itself not separately approved.
- id: gate-noop-successor-block
  subject_kinds:
  - RequirementVersion
  - CapabilityLine
  mode: required
  predicate: payload.mint_kind != 'content' OR payload.statement_hash != subject.head_hash
  approver_slots: []
  on_fail: deny
  deny_fixture: FIX-DENY-NOOP-CONTENT
  notes: 'Content-mint only: same-hash deny (ARCH-MINT-KIND / ARCH-SUCCESSION-HASH). status/pin/security_meta exempt.'
- id: gate-cyber-ship
  subject_kinds:
  - Release
  mode: optional
  predicate: release.cyber_gate == true
  approver_slots:
  - security_signoff
  - ao_approve
  on_fail: deny
  notes: Example Gate instance under WorkflowProfile (ARCH-CYBER-GATE / ARCH-GATE-MODEL).
- id: gate-verification-ship
  subject_kinds:
  - Release
  mode: optional
  predicate: all delivers.verification_outcome == pass
  approver_slots: []
  on_fail: deny
  notes: Configurable ship gate on verification_outcome (ARCH-VERIFICATION-GATE). Off in commercial default.
- id: gate-satisfies-at-create
  subject_kinds:
  - CapabilityLine
  - EdgeSatisfies
  mode: required
  predicate: exists edge satisfies from this cap
  approver_slots: []
  on_fail: deny
  notes: No orphan caps — Satisfies linked at capability creation (ARCH-CAP-LINK).
- id: gate-revert-latest-only
  subject_kinds:
  - ChangeSet
  mode: required
  predicate: subject.id == project.change_set_stack.latest_non_abandoned
  approver_slots: []
  on_fail: deny
  deny_fixture: FIX-DENY-REVERT-NON-LATEST
  notes: 'M07 / ARCH-CHANGESET-CONFLICT: whole-set revert only for latest on stack. Older whole sets require abandon-suffix.'
- id: gate-approver-slot
  subject_kinds:
  - RequirementLine
  - CapabilityLine
  mode: required
  predicate: actor matches RoleBinding for approve slot (stakeholder|solution_approver)
  approver_slots:
  - stakeholder
  - solution_approver
  on_fail: deny
  deny_fixture: FIX-DENY-APPROVE-WITHOUT-SLOT
  notes: Approve hooks require RoleBinding slot match (P0-4).
- id: gate-no-open-suspect
  subject_kinds:
  - Release
  mode: optional
  predicate: no open trace_suspect on delivers / related edges in ship scope
  approver_slots: []
  on_fail: deny
  deny_fixture: FIX-DENY-SHIP-WITH-OPEN-SUSPECT
  notes: Optional profile gate (ARCH-SUSPECT). Off in commercial default.
- id: gate-signoff-complete
  subject_kinds:
  - Release
  mode: optional
  predicate: required gate_signoff rows exist for gate-cyber-ship slots when cyber_gate
  approver_slots:
  - security_signoff
  - ao_approve
  on_fail: deny
  deny_fixture: FIX-DENY-SHIP-UNSIGNED
  notes: Cyber ship needs gate_signoff records (ARCH-GATE-SIGNOFF).
- id: gate-one-active
  subject_kinds:
  - RequirementVersion
  - CapabilityLine
  mode: required
  predicate: count(active versions for line) <= 1 after mutate
  approver_slots: []
  on_fail: deny
  deny_fixture: FIX-DENY-SECOND-ACTIVE
  notes: ≤1 active per line invariant (ARCH-VER-SUCC).
- id: gate-conforms-applicator
  subject_kinds:
  - EdgeConformsTo
  mode: required
  predicate: actor matches RoleBinding slot conforms_to_applicator
  approver_slots:
  - conforms_to_applicator
  on_fail: deny
  deny_fixture: FIX-DENY-AUTHOR-PIN-APPLY
  notes: 'Tree wins: Author request only unless profile binds Author to applicator slot.'
action_hooks:
- id: hook-line-approve
  action_id: requirement:line:approve
  subject_kind: RequirementLine
  gates_before:
  - gate-approver-slot
  effects_after:
  - write_approval_record
  - clear_planning_blocked
  - mirror_version_stakeholder_approval
  - audit
  notes: D12 Approve — line + direct children; slot-gated (UI-APPROVE-LINE).
- id: hook-line-approve-tree
  action_id: requirement:line:approve_tree
  subject_kind: RequirementLine
  gates_before:
  - gate-approver-slot
  effects_after:
  - write_approval_record_batch
  - clear_planning_blocked
  - mirror_version_stakeholder_approval
  - audit
  notes: D13 Approve Tree — full descendants; slot-gated (UI-APPROVE-TREE).
- id: hook-cap-approve
  action_id: capability:line:approve
  subject_kind: CapabilityLine
  gates_before:
  - gate-satisfies-at-create
  - gate-approver-slot
  effects_after:
  - write_approval_record
  - clear_planning_blocked
  - audit
  notes: CapabilityLine approval as solution; slot-gated (ARCH-CAP-APPROVE).
- id: hook-priority
  action_id: requirement:version:priority
  subject_kind: RequirementVersion
  gates_before:
  - gate-line-approved
  effects_after:
  - audit
  notes: D08 — reads line ApprovalRecord.
- id: hook-mint
  action_id: requirement:version:mint
  subject_kind: RequirementVersion
  gates_before:
  - gate-noop-successor-block
  - gate-one-active
  effects_after:
  - clear_line_approval_if_content_or_pin
  - set_planning_blocked_if_content
  - mark_trace_suspect_if_content
  - supersede_prior_active_on_activate
  - audit
  notes: Mint kinds drive clear/suspect/noop (ARCH-MINT-KIND). Content clears+blocks+suspects; pin clears; status/security_meta audit-only.
- id: hook-cap-create
  action_id: capability:line:create
  subject_kind: CapabilityLine
  gates_before:
  - gate-satisfies-at-create
  effects_after:
  - audit
  notes: Create CapabilityLine requires Satisfies target(s) in same mutation.
- id: hook-ship
  action_id: release:ship
  subject_kind: Release
  gates_before:
  - gate-cyber-ship
  - gate-verification-ship
  - gate-signoff-complete
  - gate-no-open-suspect
  effects_after:
  - audit
  notes: Optional gates skipped when disabled on profile. Signoff + suspect gates optional.
- id: hook-planning-wi-ready
  action_id: requirement:version:grooming
  subject_kind: RequirementVersion
  gates_before: []
  effects_after:
  - audit
  notes: Profile may add gate-line-approved to WI-ready / iteration / backlog actions (ARCH-PLANNING-GATES).
- id: hook-changeset-revert
  action_id: changeset:revert
  subject_kind: ChangeSet
  gates_before:
  - gate-revert-latest-only
  effects_after:
  - audit
  notes: M07 tip revert; non-latest deny FIX-DENY-REVERT-NON-LATEST.
- id: hook-activate
  action_id: requirement:version:activate
  subject_kind: RequirementVersion
  gates_before:
  - gate-one-active
  effects_after:
  - supersede_prior_active
  - audit
  notes: 'D04: prior active → superseded in-place same txn.'
- id: hook-pin-request
  action_id: catalog:pin:request
  subject_kind: EdgeConformsTo
  gates_before: []
  effects_after:
  - write_conformance_pin_request
  - audit
  notes: Author request-only path (E02 rewrite).
- id: hook-pin-apply
  action_id: catalog:pin:apply
  subject_kind: EdgeConformsTo
  gates_before:
  - gate-conforms-applicator
  effects_after:
  - apply_conformance_pin
  - audit
  notes: Security/Steward (or commercial-bound Author) apply.
