- uid: ARCH-CRED-AUDIT
  base_uid: ARCH-CRED-AUDIT
  version_n: 0
  status: active
  statement: 'Every authentication event is audited through the existing AuditLog pattern (ARCH-OTEL) with subject, client_id, source IP, user agent, outcome, and timestamp. Covered events: login success and failure, lockout and unlock, MFA result, step-up, token issue / refresh / rotation-reuse / revoke, client registration, session create / renew / timeout / destroy, account create / modify / disable / remove, and key operations. Secrets, tokens, and password material never appear in audit payloads.'
  priority: 5
  iteration: iter-r1
  security:
