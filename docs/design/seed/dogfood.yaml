  priority: 45
  iteration: iter-r1
  rbac_op: requirement:line:reorder
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: C05
  base_uid: C05
  version_n: 0
  status: active
  statement: 'An Author soft-deletes a line via the obsolete-version flow (D05) rather than hard-deleting rows.

