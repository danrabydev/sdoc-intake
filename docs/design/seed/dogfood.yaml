  version_n: 0
  status: active
  statement: 'Client system requirements (RequirementLine: kind requirement|section|control) and contractor capabilities (CapabilityLine: kind=capability) share line/version storage but are distinct SubjectKinds with often different RoleBindings and gates. Canonical early path: draft client req → optional activate → line approve → create CapabilityLine with Satisfies → cap approve as solution → profile-gated planning (priority/grooming/…) → later ship with profile Gates. Satisfies is the primary coverage edge (not implements in v1 encode).'
  priority: 10
  iteration: iter-r0
  rbac_op: workflow:req_vs_cap
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
