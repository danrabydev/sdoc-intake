- uid: SEC-DEVENV.1
  base_uid: SEC-DEVENV
  version_n: 1
  status: active
  statement: 'Developer environment and deployment topology for ReqAML. Docker Compose is the single supported local stand-up path and runs the fewest containers practical: one multi-role app container (API + internal OAuth AS, Web UI, MCP server, sync worker) and one peripherals container (Postgres + OpenBao), both built from one Dockerfile. Hybrid mode (peripherals only, app native with hot reload) and full-container mode are both supported. The clone-to-running path is short and documented, and migrations and the dogfood seed (with seeded dev accounts) load automatically or with one command. Sign-in goes through the internal AS, keys come from a dev OpenBao, and secrets stay out of source. Production builds ship no dev accounts, default credentials, or dev keys.'
  mint_kind: content
- uid: ARCH-DEVENV-COMPOSE.1
  base_uid: ARCH-DEVENV-COMPOSE
  version_n: 1
  status: active
  statement: "Docker Compose is the single supported developer entry point for ReqAML; the repository includes the Compose file(s) and an env template. The default stack is 2 containers, both from the repo's single Dockerfile: app (API with internal OAuth 2.1 AS, Web UI, MCP server, sync worker roles; ARCH-DEPLOY-MINIMAL) and peripherals (Postgres + OpenBao; ARCH-DEPLOY-PERIPHERALS). There is no third-party identity-stub container: local sign-in uses the internal AS with seeded dev accounts (ARCH-DEVENV-IDENTITY.1). An optional hsm-test profile builds the app with SoftHSM2 to exercise the PKCS#11 KeyProvider path without adding a peripheral container. Operators do not invent ad-hoc local wiring outside Compose for first-time stand-up."
  priority: 15
  iteration: iter-r0
  security:
    catalog_ref: CM-2
    verification_note: 'CM-2 baseline: one Dockerfile + Compose define the supported local/deploy baseline.'
  grooming_state: detailed
