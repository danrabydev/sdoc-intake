  version_n: 0
  status: active
  statement: 'SubjectKinds register what can be a workflow subject: RequirementLine, CapabilityLine, RequirementVersion, EdgeSatisfies, EdgeConformsTo, ChangeSet, Release (extensible). Each declares stable id path, readable attributes for predicates, and allowed actions. Engine does not special-case every table in if/else forever.'
  priority: 15
  iteration: iter-r0
  rbac_op: workflow:subject_kind
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
