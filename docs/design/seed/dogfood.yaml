- uid: ARCH-CP-HIER
  base_uid: ARCH-CP-HIER
  version_n: 0
  status: active
  statement: 'ReqAML organizes work as Client → Project. Projects belong to exactly one client; Client Scoped View

    is assumed for most project operations. UI and API both refuse cross-client project joins.'
  priority: 5
  iteration: iter-r0
  security:
    catalog_ref: AC-3
    verification_note: AC-3 access enforcement; AU-2/3/12 where mutating.
- uid: ARCH-CP-SCOPE
  base_uid: ARCH-CP-SCOPE
  version_n: 0
  status: active
  statement: 'Active clientId lives on the server session (not only in browser local storage). Business services and the data layer enforce client scope: every query carries a mandatory client_id predicate (repository filter and/or Postgres RLS). Search, audit, catalogs, grants, and imprint reads never cross clients. Least privilege cannot be bypassed by crafting URLs. Cross-client denial beds: FIX-DENY-CROSS-CLIENT / FIX-DENY-AUDIT-CROSS-CLIENT.'
  priority: 5
  iteration: iter-r0
  rbac_op: client:scope:select
  security:
    catalog_ref: REQALM-SEC-SCOPE
    verification_note: Maps to ReqALM project catalog SCOPE item.
