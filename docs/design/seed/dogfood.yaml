  status: active
  statement: ReqAML workflow is composed of WorkflowProfile (per project, optional client default), SubjectKind registry, Gate, ActionHook, RoleBinding, thin Transition, and ApprovalRecord. Do NOT encode product control as one lifecycle megamachine. Lifecycle status (draft|active|obsolete|withdrawn) and grooming_state remain thin; gates/hooks evaluate at action time. Workflow is app logic + seed fixtures; StrictDoc stays interchange only.
