  title: Attachments are versioned lines over content-addressed blobs
requirement_versions:
- uid: ARCH-ATTACH-VERSIONS
  base_uid: ARCH-ATTACH-VERSIONS
  version_n: 0
  status: draft
  priority: 10
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:read
  statement: An attachment is a line with a stable attachment id (^att_[0-9a-z]{26}$) and immutable versions numbered
    1, 2, and so on. Each attachment version has its own id (^attv_[0-9a-z]{26}$) and references exactly one stored
    blob, identified by its sha256 and blob id (^blob_[0-9a-f]{64}$, the hex sha256). Blobs are content-addressed
    and written once; an attachment version's blob, sha256, size, media type, and scan result never change. Adding
    a file version creates a new attachment version and never changes existing pins. Carry-forward is an explicit
    request that creates a new pin from a target parent to an existing attachment version and links the same blob;
    bytes are never copied. It requires attachment:create on the target parent and read on the source, the source
    and target must be in the same project (no cross-project carry-forward), and every link and unlink is audited.
    Blobs are reference-counted over live pins. Soft-deleting a pin decrements nothing until wipe; a blob and its
    wrapped DEK are destroyed when no live or soft-deleted pin references it. attachment:wipe on a blob is an explicit
    Client admin action with step-up that tombstones every pin referencing the blob in that project, destroys the
    blob and its DEK, and writes one audit row listing every affected pin.
  statement_hash: sha256:c8928336c3951e0d7d883e80cf095863832a54bfe236ff66ba474b921a81c2f5
  security:
    catalog_ref: CM-3
    verification_note: Cyber 2026-10-09 attachments delta v3; versioned attachment lines, content-addressed blobs,
      same-project carry-forward by link, refcounted wipe.
- uid: ARCH-ATTACH-PIN-VERSION.1
  base_uid: ARCH-ATTACH-PIN-VERSION
  version_n: 1
  status: draft
  priority: 10
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:read
  statement: 'Parent requirement and capability versions pin a specific attachment version id, never an attachment
    line or a blob directly, so stepping through a parent''s version history shows the exact file version each parent
    version pinned. A new parent version (.N) starts with no pins; carry-forward to it is explicit and links the
    same blob (ARCH-ATTACH-VERSIONS). Pins on a shipped or locked parent version, a shipped release, or a signed
    contract are immutable and append-only: pins can be added as later evidence, but not re-pinned, replaced, or
    soft-deleted except by attachment:wipe. On an unlocked parent, re-pinning to a newer attachment version is an
    explicit, audited action that flags needs re-check on the parent''s verification. Pin changes are not content
    mints and do not change statement_hash. Download URLs always reference an attachment version id; only the list
    view may show the latest version by default, and it labels it as latest. Clients, projects, releases, contracts,
    and catalog controls have no versions; their pins bind to them directly under the same rules.'
  statement_hash: sha256:2e0ffc78db8d12b8f530512b56f8e1950c672a12774b119c90a345f3676199bd
  security:
    catalog_ref: CM-3
    verification_note: 'Cyber 2026-10-09 attachments delta v3; content mint: pins target attachment version ids;
      carry-forward by link.'
  mint_kind: content
- uid: ARCH-ATTACH-SCOPE.1
  base_uid: ARCH-ATTACH-SCOPE
  version_n: 1
  status: draft
  priority: 5
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:read
  statement: 'Access to an attachment follows its parent object''s scope and role permissions at every parent level:
    listing or downloading requires the read permission of the parent as granted by the caller''s role (client read
    for a client-level attachment, project read for a project, requirement:read for a requirement version, and so
    on), checked server-side on every request; creating or deleting requires the parent''s write-level permission
    plus attachment:create. There is no attachment-specific grant model. If the caller cannot read the parent, or
    the parent or attachment is restricted for the caller, or the attachment is soft-deleted, the response is the
    same 404 as a nonexistent id, with no difference in body, headers, or timing class. Attachment ids, attachment
    version ids, and blob ids are server-generated and must match their allowlists (^att_[0-9a-z]{26}$, ^attv_[0-9a-z]{26}$,
    ^blob_[0-9a-f]{64}$); blob ids are internal and never accepted from clients; any other value is rejected with
    400 before any lookup, and the raw value is not logged (logs record a redacted placeholder). List responses
    return metadata only: attachment id, attachment version id and version number (latest labeled), sanitized display
    name, size in bytes, media type (as detected), sha256, scan state, uploaded_by identity_id, created_at. They
    never return storage keys, object-store URLs, or content.'
  statement_hash: sha256:a617561d8c3621a8d29a4d6139bcbc0bb766d7e3ccbe7a1026292a3f18f34620
  security:
    catalog_ref: AC-3
    verification_note: 'Cyber 2026-10-09 attachments delta v3; content mint: id allowlists for attachment version
      and blob ids; list shows version.'
  mint_kind: content
- uid: ARCH-ATTACH-ENCRYPT.1
  base_uid: ARCH-ATTACH-ENCRYPT
  version_n: 1
  status: draft
  priority: 20
  iteration: iter-r1
  grooming_state: detailed
  rbac_op: attachment:create
  statement: Each blob is encrypted at rest with its own data encryption key (AES-256-GCM); the DEK is wrapped by
    the KeyProvider KEK (ARCH-KEY-PROVIDER) and stored beside the blob metadata, scoped to the client. All attachment
    versions and pins that link the same blob share its DEK. Plaintext DEKs exist only in memory for one request.
    If the KeyProvider is unavailable, uploads and downloads fail closed (ARCH-KEY-FAILCLOSED). The wrapped DEK
    is destroyed together with the blob when its reference count reaches zero or when the blob is wiped (crypto-shred).
    Object-store credentials are held in the key store and never logged.
  statement_hash: sha256:f3c369c322671695712c031702184eaf9e1845f7c30e2acf47b2f06fa9c9cedb
  security:
    catalog_ref: SC-28
    verification_note: 'Cyber 2026-10-09 attachments delta v3; content mint: per-blob DEK shared by links; destroyed
      at refcount zero or wipe.'
  mint_kind: content
