# Opt-in host bindings for Postgres + OpenBao (hybrid `pnpm dev:reqaml`, migrate/seed on host).
# Default `docker compose up` keeps peripherals internal-only; the app is on 127.0.0.1:3000.
services:
  peripherals:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
