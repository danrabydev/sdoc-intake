name: ReqALM devenv smoke

# Manual dispatch only (GitHub Actions minutes are limited).
# The primary check is running `pnpm devenv:smoke` locally (needs Docker + Compose v2);
# use this workflow only for an occasional clean-runner confirmation.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reqalm/app typecheck
      - run: cp .env.example .env
      - run: pnpm devenv:smoke
      - name: Tear down
        if: always()
        run: docker compose down -v
